<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="assets/favicon.png?v=1">
<title>שנה טובה — TOOOL</title>
<meta name="theme-color" content="#0048FF">
<!-- ══ KEEP & SEND — where the card's QR lands ════════════════════════════
     Reached as /k?p=<code>, the 6-letter pair code baked into that card's QR
     (three letters per symbol, e.g. dvatap = dvash+tapuach). The code is
     STABLE on purpose: a card already out in the world keeps working even if
     the symbol set is ever reordered, which an index would not survive.
     ?p= also accepts a full pair key (dvash+tapuach) for hand testing.

     THE PAGE IS NOA'S FRAME 3485:391, 940 x 1735, and every number below is
     that frame's own. Blue ground, the card, and two yellow buttons:

       card     (32, 375)   876.488 x 594.684   r11, stroke 3 dashed 2-2
       save     (41, 1020)  496 x 141           #FFFF01, r11, 1px black
       send     (555, 1020) 342 x 141           same
       lettering 47/44.6 bold uppercase, inset 20/21 (23/21 on the right)

     THE CARD HERE IS THE CARD AFTER THE PERFORATION IS TORN OFF. That line
     exists to be torn, and whoever reached this page has already scanned the
     stub — so the QR, the SCAN TO KEEP & SEND lettering, the tear line and
     the close X are all gone. What is left is the sheet itself: the site's
     card minus its top 156, which is why every inner number here is the
     card's own minus 156 (creature 228.4 -> 72.4, WIX 949.514 -> 793.514,
     Base44 947 -> 791, greeting baseline 973.15 -> 817.15).

     The frame is 940 wide, so the whole page is laid out in that unit and
     scales with the phone's width; vertically the block keeps the frame's
     own 375-above / 574-below balance, so the composition holds on a short
     phone as well as a tall one. ══════════════════════════════════════════ -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0048FF;
    font: 700 16px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000;
    overflow: hidden;
  }

  /* the frame's unit. Width drives it; the height cap only bites on a phone
     short enough that 1161 of frame would not fit. */
  .page {
    position: fixed; inset: 0;
    --k: min(calc(100vw / 940), calc(100dvh / 1210));
  }

  /* the block the frame actually holds — card top (375) to button bottom
     (1161), 786 tall — hung so the blue above and below keeps the frame's
     ratio (375 : 574) whatever is left over */
  .wrap {
    position: absolute; left: 50%;
    transform: translateX(-50%);
    width: calc(940 * var(--k));
    height: calc(786 * var(--k));
    top: calc((100dvh - 786 * var(--k)) * 0.3951);
  }

  /* ── the card ───────────────────────────────────────────────────────── */
  .stage {
    position: absolute;
    left: calc(32 * var(--k)); top: 0;
    width: calc(876.488 * var(--k));
    height: calc(594.684 * var(--k));
  }
  /* the card's own unit: the frame draws it 876.488 wide out of 1241, so one
     card unit is 0.7062764 of a frame unit. Sized rather than transformed —
     scale() takes a number and --k is a length. */
  .card {
    --cu: calc(0.7062764 * var(--k));
    position: absolute; left: 0; top: 0;
    width: calc(1241 * var(--cu)); height: calc(842 * var(--cu));
  }
  .card > * { position: absolute; margin: 0; }
  /* the sheet and its edge in one shape: white fill, the card's own stroke
     centred on the edge (hence the 1.5 all round) */
  .card__sheet {
    left: calc(-1.5 * var(--cu)); top: calc(-1.5 * var(--cu));
    width: calc(1244 * var(--cu)); height: calc(845 * var(--cu));
  }
  .card__img {
    left: calc(56 * var(--cu)); top: calc(72.4 * var(--cu));
    width: calc(1129 * var(--cu)); height: calc(653 * var(--cu));
    overflow: hidden;
  }
  .card__img img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center;
  }
  .card__wix {
    left: calc(41 * var(--cu)); top: calc(793.514 * var(--cu));
    width: calc(51.3288 * var(--cu)); height: calc(19.8726 * var(--cu));
  }
  .card__b44 {
    left: calc(107 * var(--cu)); top: calc(791 * var(--cu));
    width: calc(118.771 * var(--cu)); height: calc(24.969 * var(--cu));
  }
  .card__vec {
    left: 0; top: 0;
    width: calc(1241 * var(--cu)); height: calc(842 * var(--cu));
  }
  /* the page is RTL and SVG text INHERITS direction — without this
     SHANA TOVA!'s "!" flips to the wrong side */
  .card__vec text { direction: ltr; unicode-bidi: isolate; }
  .card__vec .t {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700; font-size: 27px; letter-spacing: 0.29px; fill: #000;
  }

  /* ── the two buttons ────────────────────────────────────────────────── */
  .btn {
    position: absolute; appearance: none;
    top: calc(645 * var(--k));                     /* 1020 - 375 */
    height: calc(141 * var(--k));
    background: #FFFF01;
    border: 1px solid #000;
    border-radius: calc(11 * var(--k));
    padding: calc(21 * var(--k)) calc(20 * var(--k)) 0;
    font: 700 calc(47 * var(--k)) / calc(44.6 * var(--k))
          "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000;
    text-transform: uppercase;
    text-align: left;
    direction: ltr;
    cursor: pointer;
    overflow: hidden;
  }
  .btn--save { left: calc(41 * var(--k));  width: calc(496 * var(--k)); }
  .btn--send { left: calc(555 * var(--k)); width: calc(342 * var(--k));
               padding-left: calc(23 * var(--k)); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* says nothing, and takes no room, until something goes wrong or right */
  .note {
    position: absolute; left: 0; right: 0;
    top: calc(806 * var(--k));
    margin: 0; text-align: center; color: #fff;
    font-size: calc(30 * var(--k)); line-height: 1.25;
  }
  .note:empty { display: none; }

  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>

<div class="page">
  <div class="wrap">

    <div class="stage">
      <div class="card" id="card">
        <!-- the sheet: the site's card minus its torn-off top, r11, carrying
             the card's own stroke (3, dash 2-2) centred on its edge -->
        <svg class="card__sheet" viewBox="0 0 1244 845" fill="none" aria-hidden="true">
          <path d="M1.5 13C1.5 6.64873 6.64873 1.5 13 1.5H1231C1237.35 1.5 1242.5 6.64873 1242.5 13V832C1242.5 838.351 1237.35 843.5 1231 843.5H13C6.64873 843.5 1.5 838.351 1.5 832V13Z"
                fill="#fff" stroke="#000" stroke-width="3" stroke-dasharray="2 2"/>
        </svg>

        <div class="card__img"><img id="creature" src="" alt="הגלויה שלך"></div>

        <img class="card__wix" src="assets/chag/card/wix.svg?v=1" alt="Wix">
        <img class="card__b44" src="assets/chag/card/base44.svg?v=1" alt="Base44">

        <svg class="card__vec" viewBox="0 0 1241 842" fill="none" aria-hidden="true">
          <text class="t" x="626.5" y="817.15" text-anchor="middle">SHANA TOVA!</text>
        </svg>
      </div>
    </div>

    <button class="btn btn--save" id="save" type="button">Save the card</button>
    <button class="btn btn--send" id="send" type="button">Send it</button>

    <p class="note" id="note" role="status" aria-live="polite"></p>
  </div>
</div>

<script src="chag-data.js?v=9"></script>
<script>
(() => {
  const CODE = { dvash:'dva', tapuach:'tap', keves:'kev', gezer:'gez',
                 dag:'dag', kara:'kar', tamar:'tam', rimon:'rim' };
  const pairs = Object.keys(window.CHAG_RESULTS || {});
  const byCode = {};
  for (const p of pairs) {
    const [a, b] = p.split('+');
    byCode[CODE[a] + CODE[b]] = p;
  }

  const q = new URLSearchParams(location.search).get('p') || '';
  /* accept the card's 6-letter code, or a full pair key typed by hand */
  const pair = byCode[q] || (pairs.includes(q) ? q : pairs[0]);
  const rec  = (window.CHAG_RESULTS || {})[pair] || {};

  const note = document.getElementById('note');
  document.getElementById('creature').src = 'assets/chag/res-c/' + pair + '.png';
  if (rec.name) document.title = rec.name + ' — שנה טובה';

  /* ── compose the card into a PNG, at 2x ──────────────────────────────
     Drawn from the same pieces the page shows, in the same order. Each SVG
     goes through an Image so the browser rasterises it. */
  const SCALE = 2;
  const load = (src) => new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = () => rej(new Error(src));
    i.src = src;
  });
  const svgUrl = (el) => {
    const s = el.cloneNode(true);
    s.setAttribute('width', el.viewBox.baseVal.width);
    s.setAttribute('height', el.viewBox.baseVal.height);
    /* the page's stylesheet does not travel with a serialised SVG */
    s.querySelectorAll('text').forEach((t) => {
      t.setAttribute('font-family', '"Helvetica Neue", Helvetica, Arial, sans-serif');
      t.setAttribute('font-weight', '700');
      t.setAttribute('font-size', '27');
      t.setAttribute('fill', '#000');
      t.setAttribute('direction', 'ltr');
      t.setAttribute('letter-spacing', '0.29');
    });
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(new XMLSerializer().serializeToString(s));
  };

  let composed = null;
  async function compose() {
    if (composed) return composed;
    await document.fonts.ready;
    const c = document.createElement('canvas');
    c.width = 1244 * SCALE; c.height = 845 * SCALE;
    const g = c.getContext('2d');
    g.scale(SCALE, SCALE);
    /* the sheet is a rounded rect, so its corners would come out transparent
       and land black in whatever app the card is sent through. They get the
       page's own blue. */
    g.fillStyle = '#0048FF';
    g.fillRect(0, 0, 1244, 845);
    g.translate(1.5, 1.5);                 /* the card's own origin, so the
                                              stroke's outer half has room */

    const [sheet, creature, wix, b44, vec] = await Promise.all([
      load(svgUrl(document.querySelector('.card__sheet'))),
      load(document.getElementById('creature').src),
      load('assets/chag/card/wix.svg?v=1'),
      load('assets/chag/card/base44.svg?v=1'),
      load(svgUrl(document.querySelector('.card__vec'))),
    ]);

    g.drawImage(sheet, -1.5, -1.5, 1244, 845);
    /* the creature, contained in its box exactly as the CSS does it */
    const bw = 1129, bh = 653, bx = 56, by = 72.4;
    const k = Math.min(bw / creature.naturalWidth, bh / creature.naturalHeight);
    const cw = creature.naturalWidth * k, ch = creature.naturalHeight * k;
    g.drawImage(creature, bx + (bw - cw) / 2, by + (bh - ch) / 2, cw, ch);
    g.drawImage(wix, 41, 793.514, 51.3288, 19.8726);
    g.drawImage(b44, 107, 791, 118.771, 24.969);
    g.drawImage(vec, 0, 0, 1241, 842);

    composed = await new Promise((res) => c.toBlob(res, 'image/png'));
    return composed;
  }

  const fileName = 'shana-tova-' + pair.replace('+', '-') + '.png';
  const busy = (on, msg) => {
    for (const id of ['save', 'send']) document.getElementById(id).disabled = on;
    note.textContent = msg || '';
  };

  document.getElementById('save').addEventListener('click', async () => {
    busy(true, 'מכין את התמונה…');
    try {
      const blob = await compose();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
      busy(false, 'נשמר!');
    } catch (e) {
      busy(false, 'לא הצלחתי לשמור — אפשר ללחוץ לחיצה ארוכה על הגלויה ולשמור');
      console.error(e);
    }
  });

  document.getElementById('send').addEventListener('click', async () => {
    busy(true, 'מכין את התמונה…');
    try {
      const blob = await compose();
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'שנה טובה' });
        busy(false, '');
        return;
      }
      if (navigator.share) {                    /* no file support — send the link */
        await navigator.share({ title: 'שנה טובה', url: location.href });
        busy(false, '');
        return;
      }
      await navigator.clipboard.writeText(location.href);
      busy(false, 'הקישור הועתק');
    } catch (e) {
      if (e && e.name === 'AbortError') { busy(false, ''); return; }
      busy(false, 'השיתוף לא נתמך כאן — שמרי את התמונה ושלחי אותה');
      console.error(e);
    }
  });
})();
</script>

</body>
</html>
