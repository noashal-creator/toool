<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — כל ה-t לבחירת פביקון</title>
<link rel="stylesheet" href="assets/fonts/spikes-font.css">
<style>
:root{ --red:#CC0000; --sky:#7EC8F5; }
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;padding:20px}
h2{margin:0 0 4px;font-size:19px}
.sub{opacity:.6;margin:0 0 14px;font-size:13px;max-width:760px;line-height:1.6}
.bar{position:sticky;top:0;z-index:5;background:#111;padding:10px 0 14px;
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #333;margin-bottom:16px}
.bar label{font-size:13px;display:flex;gap:6px;align-items:center}
input[type=color]{width:40px;height:26px;border:1px solid #555;background:none;cursor:pointer;padding:0}
.count{opacity:.55;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
figure{margin:0;cursor:pointer}
.tile{position:relative;width:100%;aspect-ratio:1;background:var(--sky);border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;border:2px solid transparent}
figure.is-picked .tile{border-color:#fff}
canvas.big{width:100%;height:100%;display:block}
canvas.sm{width:32px;height:32px;display:block;border-radius:6px}
figcaption{margin-top:5px;font-size:10.5px;opacity:.62;line-height:1.35;direction:ltr;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{opacity:.85;font-weight:700}
/* the real-size check: 32px is what a browser tab actually shows */
.mini{position:absolute;left:6px;bottom:6px;box-shadow:0 0 0 1px rgba(0,0,0,.3);border-radius:6px}
#pick{position:fixed;inset:auto 20px 20px auto;background:#000;border:1px solid #444;border-radius:12px;
  padding:12px 14px;font-size:13px;display:none;gap:12px;align-items:center;z-index:9}
#pick.on{display:flex}
#pick canvas{width:64px;height:64px;border-radius:10px}
#pick button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;cursor:pointer}
</style></head><body>

<h2>כל ה-t שרצים בלוגו</h2>
<p class="sub">כל גופן שהאנימציה של הלוגו יכולה להעלות, עם ה-t שלו על רקע תכלת. הריבוע הקטן בפינת כל אריח הוא איך זה ייראה בגודל אמיתי בטאב (32px). לחיצה בוחרת — המספר והשם יופיעו למטה, ואפשר להוריד PNG בגודל 512.</p>

<div class="bar">
  <label>רקע <input type="color" id="bg" value="#7EC8F5"></label>
  <label>אות <input type="color" id="ink" value="#CC0000"></label>
  <label>קו מתאר <input type="color" id="stroke" value="#000000"></label>
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"></div>

<div id="pick">
  <canvas id="pv" width="512" height="512"></canvas>
  <div>
    <div id="pickName" style="direction:ltr;text-align:left"></div>
    <button id="dl">הורדה PNG 512</button>
  </div>
</div>

<script>
/* the same library and the same filter the logo uses, so this really is
   "every t that runs" — nothing here can show up that the mark cannot */
const FONTS=['"ABC Helveesti Spikes Trial"','"ABC Helveesti Trial"','"ABC Gravity Trial"',
 '"ABC Gravity Wide Trial"','"ABC Gravity Expanded Trial"','"ABC Gravity Compressed Trial"',
 '"ABC Gravity Extra Condensed Trial"','"ABC Ginto Nord Trial"','"ABC Ginto Condensed Trial"',
 '"ABC Ginto Rounded Nord Trial"','"ABC Arizona Serif Trial"','"ABC Arizona Flare Trial"',
 '"ABC Arizona Mix Trial"','"ABC Gramercy Display Trial"','"ABC Gramercy Fine Trial"',
 '"ABC Diatype Extended Trial"','"ABC Diatype Compressed Trial"','"ABC Diatype Rounded Trial"',
 '"ABC Favorit Expanded Trial"','"ABC Favorit Compressed Trial"','"ABC Camera Rounded Trial"',
 '"ABC Ikarus Contrast Trial"','"ABC Ikarus Flair Trial"','"ABC Daily Slab Trial"',
 '"ABC Daily Scotch Trial"','"ABC Estragon Trial"','"ABC Asfalt Expanded Trial"',
 '"ABC Bingo Trial"','"ABC Cowboy Trial"','"ABC Honeymoon Trial"','"ABC Bubblegum Trial"'];
const WEIGHTS=['200','300','400','500','700','800','900'];
const XH=0.52, MAX_H=0.80;
const cx=document.createElement('canvas').getContext('2d');

/* one entry per face that survives the logo's own metric rules, de-duplicated
   by the SHAPE it draws: many weights of a family are the same file, and a
   grid of identical t's is nothing to choose from */
function candidates(){
  const out=[], seen=new Set();
  for(const fam of FONTS) for(const w of WEIGHTS) for(const st of ['normal','italic']){
    cx.font=`${st} ${w} 200px ${fam}`;
    const mo=cx.measureText('o');
    const xh=(mo.actualBoundingBoxAscent+mo.actualBoundingBoxDescent)/200;
    if(!(xh>0.05)) continue;
    const sizeEm=XH/xh, m=cx.measureText('t');
    const asc=m.actualBoundingBoxAscent/200, desc=m.actualBoundingBoxDescent/200;
    if((asc+desc)*sizeEm>MAX_H) continue;
    const key=[fam,st,
      m.width.toFixed(2),asc.toFixed(3),desc.toFixed(3),
      (m.actualBoundingBoxLeft||0).toFixed(2),(m.actualBoundingBoxRight||0).toFixed(2)].join('|');
    if(seen.has(key)) continue;
    seen.add(key);
    out.push({fam,w,st,asc,desc,
      l:(m.actualBoundingBoxLeft||0)/200, r:(m.actualBoundingBoxRight||m.width)/200});
  }
  return out;
}

/* ONE painter for the tiles, the 32px check and the exported PNG, so what you
   pick is exactly what you get. Fitted by the glyph's INK box, not its em box:
   these faces disagree wildly about metrics, and an em-box fit left half of
   them floating small and off-centre in their square. */
function paint(cv, c, fill){
  const g=cv.getContext('2d'), S=cv.width;
  g.clearRect(0,0,S,S);
  g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--sky').trim();
  g.fillRect(0,0,S,S);
  const inkH=c.asc+c.desc, inkW=Math.max(c.r+c.l,0.01);
  const size=Math.min(S*fill/inkH, S*fill/inkW);
  g.font=`${c.st} ${c.w} ${size}px ${c.fam}, sans-serif`;
  /* This page is RTL, and a canvas inherits its element's direction: with rtl
     the pen aligns on the RIGHT and the glyph is laid leftwards, so every t
     was drawn off the left edge of its tile. The metrics were taken on a
     detached (ltr) canvas, so pin the drawing to ltr to match them. */
  g.direction='ltr'; g.textAlign='left'; g.textBaseline='alphabetic';
  const x=(S-inkW*size)/2 + c.l*size;      // ink left edge → centred
  const y=(S-inkH*size)/2 + c.asc*size;    // baseline that centres the ink
  g.lineWidth=size*0.045;
  g.strokeStyle=document.getElementById('stroke').value;
  g.fillStyle=document.getElementById('ink').value;
  g.strokeText('t',x,y); g.fillText('t',x,y);
}

const grid=document.getElementById('grid');
let picked=null;

document.fonts.ready.then(()=>{
  const list=candidates();
  document.getElementById('count').textContent=list.length+' גופנים';
  list.forEach((c,i)=>{
    const f=document.createElement('figure');
    f.innerHTML=`<div class="tile"><canvas class="big" width="256" height="256"></canvas>`+
      `<span class="mini"><canvas class="sm" width="64" height="64"></canvas></span></div>`+
      `<figcaption><span class="num">#${i+1}</span> ${c.fam.replace(/"|ABC |Trial/g,'').trim()} ${c.w}${c.st==='italic'?' italic':''}</figcaption>`;
    grid.appendChild(f);
    paint(f.querySelector('.big'), c, 0.62);
    paint(f.querySelector('.sm'),  c, 0.66);
    f._c=c;
    f.addEventListener('click',()=>{
      document.querySelectorAll('figure.is-picked').forEach(x=>x.classList.remove('is-picked'));
      f.classList.add('is-picked');
      picked={c,i};
      document.getElementById('pickName').textContent=
        `#${i+1} — ${c.fam.replace(/"/g,'')} ${c.w} ${c.st}`;
      document.getElementById('pick').classList.add('on');
      drawPreview();
    });
  });
});

function drawPreview(){ if(picked) paint(document.getElementById('pv'), picked.c, 0.62); }
function repaintAll(){
  document.querySelectorAll('figure').forEach(f=>{
    if(!f._c) return;
    paint(f.querySelector('.big'), f._c, 0.62);
    paint(f.querySelector('.sm'),  f._c, 0.66);
  });
  drawPreview();
}

for(const id of ['bg','ink','stroke']) document.getElementById(id).addEventListener('input',()=>{
  document.documentElement.style.setProperty(id==='bg'?'--sky':'--red',
    document.getElementById(id).value);
  repaintAll();
});
document.getElementById('dl').addEventListener('click',()=>{
  const a=document.createElement('a');
  a.download=`favicon-t-${picked?picked.i+1:'x'}.png`;
  a.href=document.getElementById('pv').toDataURL('image/png');
  a.click();
});
</script>
</body></html>
