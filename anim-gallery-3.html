<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — natural slide-in options</title>
<link rel="stylesheet" href="assets/fonts/spikes-font.css">
<style>
:root{ --sc:0.42px; --red:#FE0000; --black:#000; }
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;padding:24px}
h2{font-weight:700;margin:0 0 6px}
.sub{opacity:.6;margin:0 0 20px;font-size:14px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:1500px}
.cell{margin:0}
figcaption{margin-top:9px;font-size:15px;font-weight:700}
figcaption span{display:block;font-weight:400;opacity:.55;font-size:13px;margin-top:2px}

/* real-site geometry (Figma node 2949:14) */
.banner{position:relative;width:calc(1288 * var(--sc));height:calc(396 * var(--sc));background:#560476;overflow:hidden}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);width:calc(418.17 * var(--sc));height:calc(1051.43 * var(--sc));margin:0}
.logo .ltr{position:absolute;left:0;width:100%;margin:0;height:calc(201.25 * var(--sc));
  font-family:"ABC Helveesti Spikes Mono Trial","Helvetica Neue",sans-serif;font-weight:400;
  font-size:calc(478.17 * var(--sc));line-height:calc(201.25 * var(--sc));text-align:center;
  text-transform:uppercase;color:var(--red);-webkit-text-stroke:calc(2.46 * var(--sc)) var(--black);
  paint-order:stroke fill;transform-origin:center}
.logo .lt-t{top:calc(22.59 * var(--sc))} .logo .lt-o1{top:calc(223.84 * var(--sc))}
.logo .lt-o2{top:calc(425.09 * var(--sc))} .logo .lt-o3{top:calc(626.34 * var(--sc))}
.logo .lt-l{top:calc(827.59 * var(--sc))}
</style></head><body>
<h2>TOOOL — אפשרויות החלקה טבעית. בחרי מספר 👇</h2>
<p class="sub">כל האותיות תמיד קיימות ומחליקות פנימה מקצה שמאל (מחוץ למסגרת) — אף אות לא "נולדת" במקום, אז אין קפיצה מוזרה. t ו־l הקצוות, ה־o־ים הספקטרום ביניהם. כולן בגודל האמיתי של הלוגו, רצות בלופ.</p>
<div class="grid" id="grid"></div>

<script>
const SC = 0.42, DOOR = -470;
const TOP = { t:22.59, o1:223.84, o2:425.09, o3:626.34, l:827.59 };
const EO = 'cubic-bezier(.22,1,.36,1)';       // ease-out settle
const SPRING = 'cubic-bezier(.34,1.56,.64,1)'; // slight overshoot
const CONV = 'cubic-bezier(.4,0,.2,1)';        // conveyor

// each letter spec: {door:true}=enter from the left doorway, or {ty:units}=fixed start offset.
// omitted letters stay static at their slot the whole time.
const OPTS = [
  { id:'g1', name:'1 · Word slides in from left', desc:'כל המילה נכנסת יחד מקצה שמאל', ease:EO,
    L:{ t:{ty:-1300,d:.05,u:.55}, o1:{ty:-1300,d:.05,u:.55}, o2:{ty:-1300,d:.05,u:.55}, o3:{ty:-1300,d:.05,u:.55}, l:{ty:-1300,d:.05,u:.55} } },
  { id:'g2', name:'2 · March in (one by one)', desc:'אות אחר אות נכנסת מאותה דלת בשמאל ומתיישבת', ease:EO,
    L:{ t:{door:1,d:.03,u:.34}, o1:{door:1,d:.11,u:.34}, o2:{door:1,d:.19,u:.34}, o3:{door:1,d:.27,u:.34}, l:{door:1,d:.35,u:.34} } },
  { id:'g3', name:'3 · March in + spring', desc:'כמו 2, אבל עם overshoot קפיצי קטן בנחיתה', ease:SPRING,
    L:{ t:{door:1,d:.03,u:.34}, o1:{door:1,d:.11,u:.34}, o2:{door:1,d:.19,u:.34}, o3:{door:1,d:.27,u:.34}, l:{door:1,d:.35,u:.34} } },
  { id:'g4', name:'4 · Endpoints first, spectrum streams in', desc:'קודם t ו־l (l מחליק עד הקצה), ואז ה־o־ים נכנסים מהשמאל', ease:EO,
    L:{ t:{door:1,d:.03,u:.32}, l:{door:1,d:.11,u:.40}, o1:{door:1,d:.28,u:.30}, o2:{door:1,d:.36,u:.30}, o3:{door:1,d:.44,u:.30} } },
  { id:'g5', name:'5 · Conveyor from left', desc:'רצף רציף וקבוע כמו מסוע, ואז עצירה רכה', ease:CONV,
    L:{ t:{door:1,d:.02,u:.42}, o1:{door:1,d:.09,u:.42}, o2:{door:1,d:.16,u:.42}, o3:{door:1,d:.23,u:.42}, l:{door:1,d:.30,u:.42} } },
  { id:'g6', name:'6 · o’s fill between fixed endpoints', desc:'t ו־l קבועים; רק ה־o־ים מחליקים פנימה מהשמאל וממלאים את הרווח', ease:EO,
    L:{ o1:{door:1,d:.06,u:.36}, o2:{door:1,d:.17,u:.36}, o3:{door:1,d:.28,u:.36} } },
  { id:'g7', name:'7 · o’s fill + spring', desc:'כמו 6, קצוות קבועים, ה־o־ים נכנסים עם קפיצה עדינה', ease:SPRING,
    L:{ o1:{door:1,d:.06,u:.36}, o2:{door:1,d:.17,u:.36}, o3:{door:1,d:.28,u:.36} } },
  { id:'g8', name:'8 · Outside-in (center o last)', desc:'קודם הקצוות, אז ה־o־ים החיצוניים, ולבסוף ה־o האמצעי', ease:EO,
    L:{ t:{door:1,d:.03,u:.30}, l:{door:1,d:.11,u:.38}, o1:{door:1,d:.24,u:.30}, o3:{door:1,d:.32,u:.30}, o2:{door:1,d:.42,u:.30} } },
];

function tyUnits(letter, spec){
  if (spec.door) return (DOOR - TOP[letter]);   // same off-screen-left doorway for every letter
  return spec.ty;                                // fixed offset (rigid word)
}
const px = u => (u * SC).toFixed(2) + 'px';

let css = '';
for (const o of OPTS){
  for (const [ltr, spec] of Object.entries(o.L)){
    const start = 'translateY(' + px(tyUnits(ltr, spec)) + ')';
    const dEnd = (spec.d + spec.u) * 100;
    css += `@keyframes ${o.id}-${ltr}{`
      + `0%,${(spec.d*100).toFixed(2)}%{transform:${start}}`
      + `${dEnd.toFixed(2)}%,70%{transform:translateY(0)}`
      + `86%,100%{transform:${start}}}`;
    css += `.${o.id} .lt-${ltr}{animation:${o.id}-${ltr} 4s ${o.ease} infinite}`;
  }
}
const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

const grid = document.getElementById('grid');
const letters = '<span class="ltr lt-t">t</span><span class="ltr lt-o1">o</span><span class="ltr lt-o2">o</span><span class="ltr lt-o3">o</span><span class="ltr lt-l">l</span>';
for (const o of OPTS){
  const fig = document.createElement('figure'); fig.className='cell';
  fig.innerHTML = `<div class="banner"><h1 class="logo ${o.id}">${letters}</h1></div>`
    + `<figcaption>${o.name}<span>${o.desc}</span></figcaption>`;
  grid.appendChild(fig);
}
</script>
</body></html>
