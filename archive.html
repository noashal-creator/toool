<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — Specimen Archive</title>
<meta name="robots" content="noindex">
<style>
  /* The archive borrows the result window's own visual language: grey ground,
     white dashed cards, Helvetica spec-sheet type, the yellow pill and the
     label/rule/value stack from .mixwin__spec. Private page — the key rides
     in the URL (?k=…). */
  :root {
    --ground: #1a6fff;   /* the logo banner's own blue (styles.css .logo-banner) */
    --grey: #f0f0f0;
    --yellow: #FFFF00;   /* the site's type yellow — same as MIX and the badges */
    --red: #FE0000;
    --ink: #000;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 46px 5vw 90px;
    background: var(--ground);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── masthead ── */
  header { max-width: 1500px; margin: 0 auto 34px; }
  h1 {
    margin: 0;
    color: #fff;
    font-size: clamp(30px, 4.4vw, 54px);
    font-weight: 700;
    line-height: .96;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  .rule { height: 1px; background: #fff; margin: 14px 0 12px; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline;
    font-size: 13px;
  }
  .count {
    display: inline-flex; align-items: center;
    height: 25px; padding: 0 11px;
    background: var(--yellow);
    border: 1px solid var(--ink);
    border-radius: 12.5px;
    font-weight: 700; font-size: 13px;
  }
  .meta .note { color: rgba(255,255,255,.92); }

  /* ── grid of specimens ── */
  .grid {
    max-width: 1500px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(348px, 1fr));
    gap: 26px;
  }
  .mix {
    position: relative;
    background: #fff;
    border: 1px dashed var(--ink);
    border-radius: 11px;
    box-shadow: 0 3px 0 rgba(0,0,0,.22);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* the specimen photo — full-bleed at the top of the card, like the result
     window: 4:3, no inner frame */
  .shot {
    position: relative;
    aspect-ratio: 4 / 3;
    background: #fff;
    border-bottom: 1px dashed var(--ink);
  }
  .shot .result {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .shot .idx {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    min-width: 25px; height: 25px; padding: 0 7px;
    background: var(--yellow);
    border: 1px solid var(--ink);
    border-radius: 12.5px;
    font-weight: 700; font-size: 13px;
  }
  /* the two uploads, small, bottom-right of the photo — the recipe */
  .pair {
    position: absolute; right: 9px; bottom: 9px; z-index: 2;
    display: flex; align-items: center; gap: 5px;
    padding: 5px 7px;
    background: rgba(255,255,255,.9);
    border: 1px solid var(--ink);
    border-radius: 8px;
  }
  .pair img {
    width: 34px; height: 34px; object-fit: cover;
    border: 1px solid var(--ink); border-radius: 4px; background: var(--grey);
    display: block;
  }
  .pair .plus { font-weight: 700; font-size: 13px; }

  /* ── the entry ── */
  .body { padding: 15px 17px 17px; display: flex; flex-direction: column; gap: 9px; }
  .mix h2 {
    margin: 0;
    font-size: 19px; font-weight: 700; line-height: 1.05;
    text-transform: uppercase;
  }
  .kind { margin: 0; font-size: 13px; text-decoration: underline; }
  .desc { margin: 0; font-size: 13px; line-height: 1.4; color: #222; }

  /* label / rule / value — the result window's spec stack */
  .specs { display: flex; gap: 30px; margin-top: 3px; }
  .spec { min-width: 96px; }
  .spec .k { display: block; font-size: 13px; font-weight: 500; padding-left: 24px; }
  .spec .r { display: block; width: 78px; height: 0; border-top: 1px solid var(--ink); margin: 4px 0 4px; }
  .spec .v { display: block; font-size: 13px; font-weight: 500; padding-left: 24px; }

  footer.card-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 4px;
  }
  .when { font-size: 11px; color: #999; }
  a.dl {
    display: inline-flex; align-items: center; justify-content: center;
    height: 25px; padding: 0 13px;
    background: var(--yellow);
    border: 1px solid var(--ink);
    border-radius: 11px;
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    text-decoration: none; color: var(--ink);
  }
  a.dl:hover { filter: brightness(1.06); }
  a.dl[hidden] { display: none; }

  /* skeleton while a record's images stream in */
  .mix.is-loading .shot { background: repeating-linear-gradient(45deg,#fafafa 0 10px,#f2f2f2 10px 20px); }

  #empty, #err {
    max-width: 1500px; margin: 0 auto;
    color: var(--ink);
    padding: 18px 20px;
    background: #fff; border: 1px dashed var(--ink); border-radius: 11px;
    font-size: 14px;
  }
  #err { border-color: var(--red); }
</style>
</head>
<body>

<header>
  <h1>Specimen archive</h1>
  <div class="rule"></div>
  <div class="meta">
    <span class="count" id="count">—</span>
    <span class="note">Every mix made on the site: the two uploads, the specimen, and its entry. Newest first. Private.</span>
  </div>
</header>

<p id="empty" hidden>The archive is empty — no mixes have been made yet.</p>
<p id="err" hidden></p>
<div class="grid" id="grid"></div>

<script>
(() => {
  const API = '/.netlify/functions/mix-api';
  /* the archive is private: the gate rides in the URL as ?k=… */
  const K = new URLSearchParams(location.search).get('k') || undefined;

  const api = async (payload) => {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, k: K }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('api ' + r.status));
    return data;
  };

  const grid = document.getElementById('grid');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const when = (iso) => {
    const d = new Date(iso || 0);
    return isNaN(d) ? '' : d.toLocaleString([], {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit',
    });
  };

  function card(item, n) {
    const t = item.text || {};
    const el = document.createElement('article');
    el.className = 'mix is-loading';
    el.innerHTML =
      '<div class="shot">' +
        '<span class="idx">' + String(n).padStart(2, '0') + '</span>' +
        '<img class="result" alt="Generated specimen">' +
        '<span class="pair">' +
          '<img class="in-a" alt="Upload 1"><span class="plus">+</span><img class="in-b" alt="Upload 2">' +
        '</span>' +
      '</div>' +
      '<div class="body">' +
        '<h2>' + esc(t.name || 'Untitled specimen') + '</h2>' +
        (t.kind ? '<p class="kind">' + esc(t.kind) + '</p>' : '') +
        (t.desc ? '<p class="desc">' + esc(t.desc) + '</p>' : '') +
        '<div class="specs">' +
          '<span class="spec"><span class="k">Size</span><span class="r"></span>' +
            '<span class="v">' + esc(t.size || '—') + '</span></span>' +
          '<span class="spec"><span class="k">Weight</span><span class="r"></span>' +
            '<span class="v">' + esc(t.weight || '—') + '</span></span>' +
        '</div>' +
        '<footer class="card-foot">' +
          '<span class="when">' + esc(when(item.at)) + '</span>' +
          '<a class="dl" download="toool-' + esc(item.id) + '.png" hidden>Download</a>' +
        '</footer>' +
      '</div>';
    return el;
  }

  /* full records carry the images, so fetch each one only as it nears view */
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.unobserve(e.target);
      api({ action: 'archive-get', id: e.target.dataset.id }).then((rec) => {
        const res = rec.result || rec.result_url;
        e.target.querySelector('.result').src = res;
        e.target.querySelector('.in-a').src = rec.a || '';
        e.target.querySelector('.in-b').src = rec.b || '';
        const dl = e.target.querySelector('.dl');
        dl.href = res; dl.hidden = false;
        e.target.classList.remove('is-loading');
      }).catch(() => e.target.classList.remove('is-loading'));
    }
  }, { rootMargin: '500px' });

  api({ action: 'archive-list' }).then(({ items }) => {
    document.getElementById('count').textContent =
      items.length + (items.length === 1 ? ' specimen' : ' specimens');
    if (!items.length) { document.getElementById('empty').hidden = false; return; }
    items.forEach((item, i) => {
      const el = card(item, items.length - i);
      el.dataset.id = item.id;
      grid.appendChild(el);
      io.observe(el);
    });
  }).catch((e) => {
    const err = document.getElementById('err');
    err.textContent = /key/i.test(e.message)
      ? 'This archive is private — open it with your key link (archive.html?k=…).'
      : 'Could not load the archive: ' + e.message;
    err.hidden = false;
    document.getElementById('count').textContent = '—';
  });
})();
</script>
</body>
</html>
