<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — smooth spread options</title>
<link rel="stylesheet" href="assets/fonts/spikes-font.css">
<style>
:root{ --sc:0.46px; --red:#FE0000; --black:#000; }
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;padding:24px}
h2{font-weight:700;margin:0 0 6px}
.sub{opacity:.6;margin:0 0 22px;font-size:14px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;max-width:1500px}
figcaption{margin-top:9px;font-size:15px;font-weight:700}
figcaption span{display:block;font-weight:400;opacity:.55;font-size:13px;margin-top:2px}

/* smoothly-animatable open amount (0 = compressed, 1 = spread) */
@property --open{ syntax:'<number>'; inherits:true; initial-value:1; }

.banner{position:relative;width:calc(1288 * var(--sc));height:calc(396 * var(--sc));background:#560476;overflow:hidden}
.logo{position:absolute;left:50%;top:50%;margin:0;
  transform:translate(-50%,-50%) rotate(-90deg);
  width:calc(418.17 * var(--sc));height:calc(1051.43 * var(--sc));
  --open:1; animation:openclose 2.8s ease-in-out infinite alternate;}
@keyframes openclose{ from{--open:0} to{--open:1} }

.logo .ltr{position:absolute;left:0;width:100%;margin:0;height:calc(201.25 * var(--sc));
  font-family:"ABC Helveesti Spikes Mono Trial","Helvetica Neue",sans-serif;font-weight:400;
  font-size:calc(478.17 * var(--sc));line-height:calc(201.25 * var(--sc));text-align:center;
  text-transform:uppercase;color:var(--red);-webkit-text-stroke:calc(2.46 * var(--sc)) var(--black);
  paint-order:stroke fill;transform-origin:center;will-change:transform}
.logo .lt-t{top:calc(22.59 * var(--sc))} .logo .lt-o1{top:calc(223.84 * var(--sc))}
.logo .lt-o2{top:calc(425.09 * var(--sc))} .logo .lt-o3{top:calc(626.34 * var(--sc))}
.logo .lt-l{top:calc(827.59 * var(--sc))}

/* helper: (open-1) goes -1→0, so translate = (open-1)*offset lands at 0 when open */

/* 1 · Accordion from left — all o's + l collapse onto the T, then spread right.
   T is the left anchor. Everything always fully visible; only spacing changes. */
.v1 .lt-o1{transform:translateY(calc((var(--open) - 1) * 201.25 * var(--sc)))}
.v1 .lt-o2{transform:translateY(calc((var(--open) - 1) * 402.5  * var(--sc)))}
.v1 .lt-o3{transform:translateY(calc((var(--open) - 1) * 603.75 * var(--sc)))}
.v1 .lt-l {transform:translateY(calc((var(--open) - 1) * 805    * var(--sc)))}

/* 2 · Endpoints fixed, spectrum spreads — T and L stay put; the 3 O's start
   bunched by the T and spread out to fill the gap between the two endpoints. */
.v2 .lt-o1{transform:translateY(calc((var(--open) - 1) * 201.25 * var(--sc)))}
.v2 .lt-o2{transform:translateY(calc((var(--open) - 1) * 402.5  * var(--sc)))}
.v2 .lt-o3{transform:translateY(calc((var(--open) - 1) * 603.75 * var(--sc)))}

/* 3 · Whole word stretches open — starts compressed (35% spacing) on the left,
   the whole word stretches out to full width. T anchored on the left. */
.v3 .lt-o1{transform:translateY(calc((var(--open) - 1) * 130.8 * var(--sc)))}
.v3 .lt-o2{transform:translateY(calc((var(--open) - 1) * 261.6 * var(--sc)))}
.v3 .lt-o3{transform:translateY(calc((var(--open) - 1) * 392.4 * var(--sc)))}
.v3 .lt-l {transform:translateY(calc((var(--open) - 1) * 523.2 * var(--sc)))}

/* 4 · Endpoints fixed + spring — same as 2 but the spread lands with a gentle
   overshoot for a livelier feel. */
.v4{animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.v4 .lt-o1{transform:translateY(calc((var(--open) - 1) * 201.25 * var(--sc)))}
.v4 .lt-o2{transform:translateY(calc((var(--open) - 1) * 402.5  * var(--sc)))}
.v4 .lt-o3{transform:translateY(calc((var(--open) - 1) * 603.75 * var(--sc)))}
</style></head><body>
<h2>TOOOL — פתיחה חלקה. בחרי מספר 👇</h2>
<p class="sub">רציף לגמרי — נפתח ונסגר בלי קפיצת לופ, בלי אות שמגיעה מבחוץ, בלי הופעה-פתאומית. כל האותיות תמיד קיימות, רק המרווח נפתח משמאל. (בלופ נפתח↔נסגר כדי שתראי את החלקות; באתר זה ייפתח פעם אחת בטעינה וייסגר בגלילה.)</p>
<div class="grid">
  <figure><div class="banner"><h1 class="logo v1"><span class="ltr lt-t">t</span><span class="ltr lt-o1">o</span><span class="ltr lt-o2">o</span><span class="ltr lt-o3">o</span><span class="ltr lt-l">l</span></h1></div><figcaption>1 · Accordion from left<span>הכל צמוד ל־T ואז נפרש ימינה</span></figcaption></figure>
  <figure><div class="banner"><h1 class="logo v2"><span class="ltr lt-t">t</span><span class="ltr lt-o1">o</span><span class="ltr lt-o2">o</span><span class="ltr lt-o3">o</span><span class="ltr lt-l">l</span></h1></div><figcaption>2 · Endpoints fixed, spectrum spreads<span>t ו־l קבועים, ה־o־ים נפרשים ביניהם</span></figcaption></figure>
  <figure><div class="banner"><h1 class="logo v3"><span class="ltr lt-t">t</span><span class="ltr lt-o1">o</span><span class="ltr lt-o2">o</span><span class="ltr lt-o3">o</span><span class="ltr lt-l">l</span></h1></div><figcaption>3 · Whole word stretches<span>המילה נמתחת מכיווץ לרוחב מלא</span></figcaption></figure>
  <figure><div class="banner"><h1 class="logo v4"><span class="ltr lt-t">t</span><span class="ltr lt-o1">o</span><span class="ltr lt-o2">o</span><span class="ltr lt-o3">o</span><span class="ltr lt-l">l</span></h1></div><figcaption>4 · Endpoints fixed + spring<span>כמו 2, עם נחיתה קפיצית עדינה</span></figcaption></figure>
</div>
</body></html>
