<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — 6 animation options</title>
<link rel="stylesheet" href="assets/fonts/spikes-font.css">
<style>
:root{ --sc:0.48px; --red:#FE0000; --black:#000; }
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;padding:24px}
h2{font-weight:700;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1440px}
.cell{margin:0}
figcaption{margin-top:8px;font-size:15px;font-weight:700}
.banner{position:relative;width:calc(1288 * var(--sc));height:calc(368 * var(--sc));background:#560476;overflow:hidden}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);width:calc(509 * var(--sc));height:calc(1280 * var(--sc));margin:0}
.logo .ltr{position:absolute;left:0;width:100%;margin:0;height:calc(189 * var(--sc));font-family:"ABC Helveesti Spikes Mono Trial","Helvetica Neue",sans-serif;font-weight:400;font-size:calc(481 * var(--sc));line-height:calc(189 * var(--sc));text-align:center;text-transform:uppercase;color:var(--red);-webkit-text-stroke:calc(3 * var(--sc)) var(--black);paint-order:stroke fill;transform-origin:center}
.logo .lt-t{top:calc(167.5 * var(--sc))} .logo .lt-o1{top:calc(356.5 * var(--sc))} .logo .lt-o2{top:calc(545.5 * var(--sc))} .logo .lt-o3{top:calc(734.5 * var(--sc))} .logo .lt-l{top:calc(923.5 * var(--sc))}
.v1 .lt-l{animation:v1l 4s ease-in-out infinite;}
.v1 .lt-o1{animation:v1o1 4s ease-in-out infinite;}
.v1 .lt-o2{animation:v1o2 4s ease-in-out infinite;}
.v1 .lt-o3{animation:v1o3 4s ease-in-out infinite;}
.v2 .lt-l{animation:v2l 4s ease-in-out infinite;}
.v2 .lt-o1{animation:v2o1 4s ease-in-out infinite;}
.v2 .lt-o2{animation:v2o2 4s ease-in-out infinite;}
.v2 .lt-o3{animation:v2o3 4s ease-in-out infinite;}
.v3 .lt-l{animation:v3l 4s ease-in-out infinite;}
.v3 .lt-o1{animation:v3o1 4s ease-in-out infinite;}
.v3 .lt-o2{animation:v3o2 4s ease-in-out infinite;}
.v3 .lt-o3{animation:v3o3 4s ease-in-out infinite;}
.v4 .lt-l{animation:v4l 4s ease-in-out infinite;}
.v4 .lt-o1{animation:v4o1 4s ease-in-out infinite;}
.v4 .lt-o2{animation:v4o2 4s ease-in-out infinite;}
.v4 .lt-o3{animation:v4o3 4s ease-in-out infinite;}
.v5 .lt-l{animation:v5l 4s ease-in-out infinite;}
.v5 .lt-o1{animation:v5o1 4s ease-in-out infinite;}
.v5 .lt-o2{animation:v5o2 4s ease-in-out infinite;}
.v5 .lt-o3{animation:v5o3 4s ease-in-out infinite;}
.v6 .lt-l{animation:v6l 4s ease-in-out infinite;}
.v6 .lt-o1{animation:v6o1 4s cubic-bezier(.34,1.56,.64,1) infinite;}
.v6 .lt-o2{animation:v6o2 4s cubic-bezier(.34,1.56,.64,1) infinite;}
.v6 .lt-o3{animation:v6o3 4s cubic-bezier(.34,1.56,.64,1) infinite;}
@keyframes v1l {
  0%,5% { transform: translateY(calc(-567 * var(--sc))); }
  30%,64% { transform: translateY(0); }
  82%,100% { transform: translateY(calc(-567 * var(--sc))); }
}
@keyframes v1o1 {
  0%,6% { transform: translateY(calc(-189 * var(--sc))) scaleY(0); }
  24%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(calc(-189 * var(--sc))) scaleY(0); }
}
@keyframes v1o2 {
  0%,12% { transform: translateY(calc(-378 * var(--sc))) scaleY(0); }
  30%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(calc(-378 * var(--sc))) scaleY(0); }
}
@keyframes v1o3 {
  0%,18% { transform: translateY(calc(-567 * var(--sc))) scaleY(0); }
  36%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(calc(-567 * var(--sc))) scaleY(0); }
}
@keyframes v2l {
  0%,5% { transform: translateY(calc(-567 * var(--sc))); }
  30%,64% { transform: translateY(0); }
  82%,100% { transform: translateY(calc(-567 * var(--sc))); }
}
@keyframes v2o1 {
  0%,6% { transform: translateY(0) scaleY(0); }
  24%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }
}
@keyframes v2o2 {
  0%,12% { transform: translateY(0) scaleY(0); }
  30%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }
}
@keyframes v2o3 {
  0%,18% { transform: translateY(0) scaleY(0); }
  36%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }
}
@keyframes v3l {
  0%,5% { transform: translateY(calc(-567 * var(--sc))); }
  30%,64% { transform: translateY(0); }
  82%,100% { transform: translateY(calc(-567 * var(--sc))); }
}
@keyframes v3o1 {
  0%,10% { transform: translateY(calc(0 * var(--sc))) scaleY(0); }
  26%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(calc(0 * var(--sc))) scaleY(0); }
}
@keyframes v3o2 {
  0%,16% { transform: translateY(calc(-189 * var(--sc))) scaleY(0); }
  32%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(calc(-189 * var(--sc))) scaleY(0); }
}
@keyframes v3o3 {
  0%,22% { transform: translateY(calc(-378 * var(--sc))) scaleY(0); }
  38%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(calc(-378 * var(--sc))) scaleY(0); }
}
@keyframes v4l {

  30%,64% { transform: translateY(0); }
  82%,100% { transform: translateY(calc(-567 * var(--sc))); }
}
@keyframes v4o2 {
  0%,6% { transform: translateY(0) scaleY(0); }
  24%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }
}
@keyframes v4o1 {
  0%,16% { transform: translateY(0) scaleY(0); }
  34%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }

@keyframes v5l {
  0%,10% { transform: translateY(calc(-567 * var(--sc))); }
  20%,26% { transform: translateY(calc(-378 * var(--sc))); }
  36%,42% { transform: translateY(calc(-189 * var(--sc))); }
  52%,64% { transform: translateY(0); }
  82%,100% { transform: translateY(calc(-567 * var(--sc))); }
}
@keyframes v5o1 {
  0%,14% { transform: translateY(0) scaleY(0); }
  20%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }
}
@keyframes v5o2 {
  0%,30% { transform: translateY(0) scaleY(0); }
  36%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }
}
@keyframes v5o3 {
  0%,46% { transform: translateY(0) scaleY(0); }
  52%,64% { transform: translateY(0) scaleY(1); }
  82%,100% { transform: translateY(0) scaleY(0); }

@keyframes v6l {

@keyframes v6o1 {
  0%,6% { transform: translateY(calc(0 * var(--sc))) scale(0); }
  20% { transform: translateY(calc(0 * var(--sc))) scale(1.12); }
  24%,64% { transform: translateY(calc(0 * var(--sc))) scale(1); }

}
@keyframes v6o2 {
  0%,12% { transform: translateY(calc(0 * var(--sc))) scale(0); }
  26% { transform: translateY(calc(0 * var(--sc))) scale(1.12); }
  30%,64% { transform: translateY(calc(0 * var(--sc))) scale(1); }

@keyframes v6o3 {

  32% { transform: translateY(calc(0 * var(--sc))) scale(1.12); }
  36%,64% { transform: translateY(calc(0 * var(--sc))) scale(1); }
  82%,100% { transform: translateY(calc(0 * var(--sc))) scale(0); }
}

</style></head><body>

<div class="grid">
  <figure class="cell"><div class="banner"><h1 class="logo v1"><span class="ltr lt-t">t</span><span class="ltr lt-o1">o</span><span class="ltr lt-o2">o</span><span class="ltr lt-o3">o</span><span class="ltr lt-l">l</span></h1></div><figcaption>1 · Slide-out from T</figcaption></figure>
