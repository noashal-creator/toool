<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — sidebar options</title>
<link rel="stylesheet" href="assets/fonts/spikes-font.css">
<style>
  :root{
    --red:#FE0000; --yellow:#FFFF01; --gray:#8A8A8A; --purple:#B700FF;
    --green:#59d329; --black:#000;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:#e9e9e9; color:#000;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700;
    padding:28px;
  }
  h1{font-size:22px;margin:0 0 4px}
  .lead{font-weight:400;font-size:14px;color:#555;margin:0 0 22px;max-width:720px}
  .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  figure{margin:0}
  figcaption{margin-top:10px;width:300px}
  figcaption b{font-size:15px}
  figcaption small{display:block;font-weight:400;color:#555;font-size:12px;margin-top:2px;line-height:1.35}

  /* ── a sidebar card (proportional to the real 440×1084 column) ── */
  .sb{
    width:300px;height:740px;position:relative;overflow:hidden;
    background:var(--gray);display:flex;flex-direction:column;
    padding:22px;gap:12px;border:1px solid #0002;
  }

  /* header */
  .rc-title{margin:0;font-size:30px;line-height:.95;letter-spacing:-.5px}
  .rc-sub{margin:3px 0 0;font-size:15px}

  /* numbered step */
  .step{display:flex;align-items:center;gap:9px}
  .step__num{
    flex:none;width:24px;height:24px;border-radius:50%;
    background:var(--purple);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:14px;line-height:1;
  }
  .step__text{margin:0;font-size:14px;line-height:1.15}

  /* upload slot */
  .slot{
    position:relative;width:100%;height:132px;background:var(--yellow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .slot::before{content:"";position:absolute;inset:6px;border:2px dashed #000}
  .slot svg{width:30px;height:30px}
  .slot span{font-size:15px}

  /* the mixer: hand + spoon over the RUN bowl */
  .mixer{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:4px}
  .mixer__tool{position:relative;width:100%;height:96px;transform-origin:32% 82%}
  .mixer__tool .hand{position:absolute;left:-8px;bottom:0;width:120px;height:auto}
  .mixer__tool .spoon{position:absolute;left:56px;bottom:30px;width:150px;height:auto}
  .sb:hover .mixer__tool{animation:stir .4s ease-in-out infinite}
  @keyframes stir{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}

  /* RUN → a bowl (inverted trapezoid) */
  .bowl{
    border:0;font:inherit;color:#000;cursor:pointer;
    width:150px;height:88px;background:var(--red);
    clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:12px;font-size:26px;
  }

  /* ═══ Variant A — recipe, current site colours (gray + yellow) ═══ */
  /* (uses the defaults above) */

  /* ═══ Variant B — yellow sidebar, gray slots (the mockup) ═══ */
  .sb--b{background:var(--yellow)}
  .sb--b .slot{background:#d7d7d7}
  .sb--b .step__num{background:var(--black)}

  /* ═══ Variant C — minimal / dry ═══ */
  .sb--c{background:#f2f2f2;gap:10px}
  .sb--c .rc-title{font-size:16px;letter-spacing:0;text-transform:uppercase}
  .sb--c .rc-sub{display:none}
  .sb--c .step{gap:7px}
  .sb--c .step__num{width:18px;height:18px;font-size:11px;background:#000;border-radius:0}
  .sb--c .step__text{font-size:12px;color:#333}
  .sb--c .slot{background:#fff;height:150px}
  .sb--c .slot::before{border:1px dashed #999}
  .sb--c .slot span{font-size:12px;color:#666}
  .sb--c .bowl{width:130px;height:74px;font-size:22px}
  .sb--c .mixer__tool .hand{width:96px}
  .sb--c .mixer__tool .spoon{left:44px;width:120px}

  /* ═══ Variant D — big literal mixing bowl ═══ */
  .sb--d .slot{height:104px}
  .sb--d .mixer{gap:0}
  .sb--d .mixer__tool{height:70px;z-index:2;margin-bottom:-18px}
  .sb--d .mixer__tool .hand{width:104px}
  .sb--d .mixer__tool .spoon{left:48px;bottom:22px;width:135px}
  .sb--d .bowl{width:230px;height:150px;font-size:34px;padding-bottom:18px;
    clip-path:polygon(0 0,100% 0,70% 100%,30% 100%)}
</style>
</head>
<body>

<h1>Sidebar options — pick one</h1>
<p class="lead">All four use the “recipe” idea: two ingredients → a hand with a spoon → a RUN button shaped like a bowl. Hover a card to see the hand “mix”. Copy is dry/technical. Tell me a letter (or mix-and-match) and I’ll build it into the real site.</p>

<div class="row">

  <!-- A -->
  <figure>
    <div class="sb sb--a">
      <header><h2 class="rc-title">Welcome to Toool!</h2><p class="rc-sub">Let's make something.</p></header>
      <div class="step"><span class="step__num">1</span><p class="step__text">Upload the first image.</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>object 1</span></div>
      <div class="step"><span class="step__num">2</span><p class="step__text">Upload the second image.</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>object 2</span></div>
      <div class="mixer">
        <div class="mixer__tool"><img class="hand" src="assets/hand.png" alt=""><svg class="spoon" viewBox="0 0 220 70"><rect x="6" y="29" width="150" height="12" rx="6" fill="#c9ccd1" stroke="#000" stroke-width="4"/><ellipse cx="180" cy="35" rx="34" ry="24" fill="#dfe2e6" stroke="#000" stroke-width="4"/></svg></div>
        <button class="bowl">RUN</button>
      </div>
    </div>
    <figcaption><b>A · Recipe (gray)</b><small>Current site colours — gray bar, yellow slots. Numbered steps, welcome line.</small></figcaption>
  </figure>

  <!-- B -->
  <figure>
    <div class="sb sb--b">
      <header><h2 class="rc-title">Welcome to Toool!</h2><p class="rc-sub">Let's make something.</p></header>
      <div class="step"><span class="step__num">1</span><p class="step__text">Upload the first image.</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>object 1</span></div>
      <div class="step"><span class="step__num">2</span><p class="step__text">Upload the second image.</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>object 2</span></div>
      <div class="mixer">
        <div class="mixer__tool"><img class="hand" src="assets/hand.png" alt=""><svg class="spoon" viewBox="0 0 220 70"><rect x="6" y="29" width="150" height="12" rx="6" fill="#c9ccd1" stroke="#000" stroke-width="4"/><ellipse cx="180" cy="35" rx="34" ry="24" fill="#dfe2e6" stroke="#000" stroke-width="4"/></svg></div>
        <button class="bowl">RUN</button>
      </div>
    </div>
    <figcaption><b>B · Recipe (yellow)</b><small>Your mockup — yellow bar, gray slots, black step numbers.</small></figcaption>
  </figure>

  <!-- C -->
  <figure>
    <div class="sb sb--c">
      <header><h2 class="rc-title">toool</h2></header>
      <div class="step"><span class="step__num">1</span><p class="step__text">first image</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#666" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>drop image</span></div>
      <div class="step"><span class="step__num">2</span><p class="step__text">second image</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#666" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>drop image</span></div>
      <div class="mixer">
        <div class="mixer__tool"><img class="hand" src="assets/hand.png" alt=""><svg class="spoon" viewBox="0 0 220 70"><rect x="6" y="29" width="150" height="12" rx="6" fill="#c9ccd1" stroke="#000" stroke-width="4"/><ellipse cx="180" cy="35" rx="34" ry="24" fill="#dfe2e6" stroke="#000" stroke-width="4"/></svg></div>
        <button class="bowl">RUN</button>
      </div>
    </div>
    <figcaption><b>C · Minimal / dry</b><small>No welcome, tiny square step marks, spare labels. Most technical.</small></figcaption>
  </figure>

  <!-- D -->
  <figure>
    <div class="sb sb--d">
      <header><h2 class="rc-title">Welcome to Toool!</h2><p class="rc-sub">Let's make something.</p></header>
      <div class="step"><span class="step__num">1</span><p class="step__text">Upload the first image.</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>object 1</span></div>
      <div class="step"><span class="step__num">2</span><p class="step__text">Upload the second image.</p></div>
      <div class="slot"><svg viewBox="0 0 48 51" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M23.5 3V35"/><path d="M12 14 23.5 3 35 14"/><path d="M2.5 36V47.5H44.5V36"/></svg><span>object 2</span></div>
      <div class="mixer">
        <div class="mixer__tool"><img class="hand" src="assets/hand.png" alt=""><svg class="spoon" viewBox="0 0 220 70"><rect x="6" y="29" width="150" height="12" rx="6" fill="#c9ccd1" stroke="#000" stroke-width="4"/><ellipse cx="180" cy="35" rx="34" ry="24" fill="#dfe2e6" stroke="#000" stroke-width="4"/></svg></div>
        <button class="bowl">RUN</button>
      </div>
    </div>
    <figcaption><b>D · Big bowl</b><small>The RUN bowl dominates; the spoon rests in it. Most literal “mixing”.</small></figcaption>
  </figure>

</div>
</body>
</html>
