<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png?v=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chag — card design bench (1:1 overlay)</title>
<!-- ══ DESIGN BENCH — the chag result card, 1:1 from Figma 3438:141 ═══════
     Not linked from any page, not loaded by chag.html, not deployed.

     HOW 1:1 IS GUARANTEED, not claimed:
     the card is drawn at its RAW frame size (1241x998 px, one CSS px per
     Figma px) and only then scaled with a transform. Every child is
     therefore authored in the frame's own numbers — no unit conversion, no
     calc(), no rounding. The frame's own PNG render is then laid over the
     top at the same 1:1 grid (offset -1.5,-1.5 for the border's stroke
     bleed), with an opacity slider and a DIFFERENCE blend: where the two
     agree, difference paints black. Anything that glows is a real error.

     Every number below was either read out of the node's data / its
     exported SVGs, or measured off the frame's own render:
       card       0,0 1241x998, r11, stroke #000 w3 dash 2-2 (path verbatim)
       QR box     17,15 127x126, r11, #FFFF01, 1px black
       QR image   25,22 111x112 (inner crop 123.23% x 121.66% @ -11.61%,-10.83%)
       SCAN text  box 158,7 236x76; baselines 42 / 70; 29px bold, black
                  fill + dashed 2-2 contour (stem measured 5px vs 4.1px
                  plain => stroke-width 1). Baselines and tracking are set
                  from the frame's INK, not its nominal leading: its two
                  cap-tops sit 28.0px apart, not the node's 27.6.
       X circle   1182,19 37x37, fill #560476, 1px black, + the site's own
                  two-bar X at 60% (22.2px), WHITE - Noa asked for it; the
                  frame itself leaves the dot empty
       perforation y=156, straight 16->1225, curling down to y=167.5 at both
                  card edges (Vector 207 + 208/209, beziers verbatim)
       white sheet 18.5,175.5 1204x804; scallop r14.4, 44 tips across
                  (pitch 27.33), 30 down (26.73), depth 9.9 / 9.1
       creature   56,222.75 1129x653, contain - the box sits on the card's
                  optical centre (equal 33.75px of white above and below),
                  and each source is a canvas centred on its own object
       SHANA TOVA! 29px bold, plain fill, baseline y=930, centred.
                  Cap height matches the frame EXACTLY (21px). Its ink is
                  195px wide against the frame's 183px, because in Figma the
                  greeting is baked inside image 57 - a bitmap placed at
                  107.76% wide by 129.28% tall, i.e. squashed ~6% sideways.
                  Reproducing that would mean shipping distorted letters, so
                  this is clean type at the frame's own size. Flagged.
     ZERO deviations: the red is the frame's own #FC0000 (Noa: "0 mistakes,
     exactly like Figma"). R toggles the site's #E60000 for comparison. ══ -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 18px 60px;
    background: #d9d9d9;
    font: 13px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #222;
  }

  /* ── the control bar ── */
  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 10px 14px; margin-bottom: 14px;
    background: #fff; border: 1px solid #bbb; border-radius: 8px;
  }
  .bar b { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .bar label { display: flex; gap: 7px; align-items: center; white-space: nowrap; }
  .bar input[type=range] { width: 190px; }
  .bar .k { font-variant-numeric: tabular-nums; min-width: 42px; }
  .bar .hint { color: #666; }
  kbd {
    font: 11px/1 ui-monospace, Menlo, monospace; background: #eee;
    border: 1px solid #ccc; border-radius: 3px; padding: 2px 4px;
  }

  /* ── the stage: reserves the SCALED size, holds the unscaled card ── */
  .stage {
    position: relative;
    width: calc(1241px * var(--k));
    height: calc(998px * var(--k));
    margin: 0 auto;
  }

  /* ONE CSS px = ONE Figma px inside here. Do not add calc() to children. */
  .card {
    position: absolute; left: 0; top: 0;
    width: 1241px; height: 998px;
    transform: scale(var(--k));
    transform-origin: 0 0;
    --red: #FC0000;                 /* the frame's own fill (R toggles the site red) */
  }
  .card.is-site-red { --red: #E60000; }
  .card > * { position: absolute; }

  /* the card's ground + dashed border — the node's own path, verbatim */
  .card__frame { left: -1.5px; top: -1.5px; width: 1244px; height: 1001px; }

  /* QR */
  .card__qrbox {
    left: 17px; top: 15px; width: 127px; height: 126px;
    background: #FFFF01; border: max(1px, calc(1px * var(--k))) solid #000; border-radius: 11px;
  }
  .card__qr {
    left: 25px; top: 22px; width: 111px; height: 112px;
    overflow: hidden;
  }
  .card__qr img {
    position: absolute;
    width: 123.23%; height: 121.66%; left: -11.61%; top: -10.83%;
    max-width: none;
  }

  /* the close button — the purple dot is drawn in the vector layer below,
     this is just the hit area sitting exactly on top of it */
  .card__x {
    left: 1182px; top: 19px; width: 37px; height: 37px;
    background: none; border: 0; border-radius: 50%; padding: 0;
    cursor: pointer;
  }

  /* the scalloped sheet + the creature that sits inside it */
  .card__panel { left: 18.5px; top: 175.5px; width: 1204px; height: 804px; }
  /* the creature box, placed on the card's OPTICAL centre: the card's own
     centre horizontally, and vertically midway between the sheet's solid top
     (189) and the greeting's cap-top (909.5) -> 549.25, which leaves an equal
     33.75px of white above and below. The images in assets/chag/res-c/ are
     canvases centred on each object's own ink bbox, so `contain` drops every
     object dead centre at whatever size it was shot. */
  .card__img   { left: 56px; top: 222.75px; width: 1129px; height: 653px; overflow: hidden; }
  .card__img img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center;
  }

  /* the vector layer: perforation, lettering, the purple dot.
     viewBox 1241x998 => 1 user unit is 1 frame px. */
  .card__vec {
    left: 0; top: 0; width: 1241px; height: 998px;
    pointer-events: none;
  }
  /* the card's lettering is ENGLISH and must always set left-to-right, even
     when the surrounding page is RTL (cards.html is dir="rtl"): without this
     the browser lays "SCAN TO KEEP" out leftward from its x and flips the "!"
     of SHANA TOVA! to the wrong side. */
  .card__vec text { direction: ltr; unicode-bidi: isolate; }
  .card__vec .t {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700; font-size: 29px; letter-spacing: 0.29px;
    fill: #000;
  }
  /* the notched contour of the sidebar instructions.
     letter-spacing is 0.20 rather than the node's 0.29 ON PURPOSE: Figma
     renders "Helvetica Neue W01 75 Bold", the browser has the local
     Helvetica Neue cut, which is 0.45% wider per em. At 0.20 the block
     measures 218px of ink — the frame's own 218px, to the pixel. */
  .card__vec .t--stitched {
    letter-spacing: 0.20px;
    stroke: #000; stroke-width: 1; stroke-dasharray: 2 2;
    paint-order: stroke;
  }

  /* ── the overlay: the frame's own render, on the same 1:1 grid ── */
  .card__ref {
    left: -1.5px; top: -1.5px; width: 1244px; height: 1001px;
    opacity: var(--refop, .5);
    mix-blend-mode: var(--refblend, normal);
    pointer-events: none;
  }
  .card.is-ref-off .card__ref { display: none; }
</style>
</head>
<body>

<div class="bar">
  <b>1:1 בדיקה מול פיגמה 3438:141</b>
  <label>שקיפות <input type="range" id="op" min="0" max="100" value="50">
    <span class="k" id="opv">50%</span></label>
  <label><input type="checkbox" id="diff"> הפרש (difference)</label>
  <label>זום
    <select id="zoom">
      <option value="fit" selected>התאם למסך</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select></label>
  <label><input type="checkbox" id="red"> אדום האתר (#E60000)</label>
  <span class="hint"><kbd>O</kbd> שכבה · <kbd>D</kbd> הפרש · <kbd>R</kbd> אדום · <kbd>[</kbd> <kbd>]</kbd> זום</span>
</div>

<div class="stage" id="stage" style="--k:1">
  <div class="card" id="card">

    <!-- ground + dashed border: Rectangle 166's own path -->
    <svg class="card__frame" viewBox="0 0 1244 1001" fill="none" aria-hidden="true">
      <path d="M1.5 12.5C1.5 6.42485 6.42487 1.5 12.5 1.5H1231.5C1237.58 1.5 1242.5 6.42487 1242.5 12.5V988.5C1242.5 994.575 1237.58 999.5 1231.5 999.5H12.5C6.42485 999.5 1.5 994.575 1.5 988.5V12.5Z"
            fill="var(--red)" stroke="#000" stroke-width="3" stroke-dasharray="2 2"/>
    </svg>

    <div class="card__qrbox"></div>
    <div class="card__qr"><img src="assets/chag/card/qr-frame.png" alt=""></div>

    <img class="card__panel" src="assets/chag/card/panel.svg?v=4" alt="">
    <div class="card__img"><img src="assets/chag/res-c/gezer+kara.png" alt=""></div>

    <svg class="card__vec" viewBox="0 0 1241 998" fill="none" aria-hidden="true">
      <!-- the tear line: straight across, curling down into both card edges
           (Vector 209 mirrored + Vector 207 + Vector 208, beziers verbatim) -->
      <path d="M0 167.5C0 156.693 9 156 16 156H1225C1232 156 1241 156.693 1241 167.5"
            stroke="#000" stroke-width="3" stroke-dasharray="2 2"/>
      <!-- the close dot: Ellipse 65. The frame draws no glyph inside it; Noa
           asked for the X the site already uses (styles.css .mixwin__x) - the
           same two-bar path, at the site's 60% of the circle diameter:
           22.2 / 26 = 0.8538, centred on the dot at (1200.5, 37.5).
           White, not the site's black: on #560476 this design already pairs
           purple with white (the sidebar's step circles, the MIX lettering). -->
      <circle cx="1200.5" cy="37.5" r="18.5" fill="#560476" stroke="#000"/>
      <g transform="translate(1189.4 26.4) scale(0.8538)" fill="#fff">
        <path d="M22.5601 6.01379L19.9862 3.43992L3.43992 19.9862L6.01378 22.5601L22.5601 6.01379Z"/>
        <path d="M6.01379 3.43992L3.43992 6.01378L19.9862 22.5601L22.5601 19.9862L6.01379 3.43992Z"/>
      </g>
      <!-- lettering -->
      <text class="t t--stitched" x="159" y="42">SCAN TO KEEP</text>
      <text class="t t--stitched" x="159" y="70">&amp; SEND</text>
      <text class="t" x="620.5" y="930" text-anchor="middle">SHANA TOVA!</text>
    </svg>

    <button class="card__x" type="button" aria-label="Close"></button>

    <img class="card__ref" id="ref" src="assets/chag/card/ref/frame90.png" alt="">
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const card  = document.getElementById('card');
  const op    = document.getElementById('op');
  const opv   = document.getElementById('opv');
  const diff  = document.getElementById('diff');
  const zoom  = document.getElementById('zoom');
  const red   = document.getElementById('red');

  const apply = () => {
    card.style.setProperty('--refop', op.value / 100);
    opv.textContent = op.value + '%';
    card.style.setProperty('--refblend', diff.checked ? 'difference' : 'normal');
    card.classList.toggle('is-ref-off', op.value === '0');
    card.classList.toggle('is-site-red', red.checked);
    const k = zoom.value === 'fit'
      ? Math.min(1, (innerWidth - 60) / 1241, (innerHeight - 120) / 998)
      : zoom.value;
    stage.style.setProperty('--k', k);
  };
  [op, diff, zoom, red].forEach(el => el.addEventListener('input', apply));

  addEventListener('keydown', (e) => {
    const zs = [...zoom.options].map(o => o.value);
    if (e.key === 'o' || e.key === 'O') { op.value = op.value === '0' ? 50 : 0; }
    else if (e.key === 'd' || e.key === 'D') { diff.checked = !diff.checked; }
    else if (e.key === 'r' || e.key === 'R') { red.checked = !red.checked; }
    else if (e.key === '[') { zoom.selectedIndex = Math.max(0, zoom.selectedIndex - 1); }
    else if (e.key === ']') { zoom.selectedIndex = Math.min(zs.length - 1, zoom.selectedIndex + 1); }
    else return;
    e.preventDefault(); apply();
  });
  addEventListener('resize', () => { if (zoom.value === 'fit') apply(); });
  apply();
</script>

</body>
</html>
