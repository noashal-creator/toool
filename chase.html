<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Brigitte Breaux</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#ebebea;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}

/* ── Main stage ── */
.stage{
  width:100%;max-width:1100px;height:540px;
  position:relative;overflow:hidden;
  cursor:none;user-select:none;
  border:1px solid #ddd;
  /* default background — user will change this */
  background:pink;
}
/* background image layer */
#stageBg{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:none; /* hidden until user uploads or picks a texture */
  pointer-events:none;
  z-index:0;
}
/* drop overlay */
.dropz{
  position:absolute;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  opacity:0;transition:opacity .15s;cursor:pointer;
  background:transparent;
}
.dropz:hover,.dropz.over{opacity:1}
/* once a background image is set, the stage no longer opens the picker on click —
   only the "Upload image" button below changes it */
.stage.has-bg .dropz{display:none;pointer-events:none}
.dropz svg{width:28px;height:28px;stroke:#666;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dropz p{font-size:12px;color:#666}

/* cut-out cursor elements */
.cur{position:absolute;pointer-events:none;z-index:40;transform:translate(-50%,-50%);will-change:left,top}
.cur img{display:block;object-fit:contain;transform:scale(var(--thumb-zoom,1));transform-origin:center}

/* ── Controls ── */
.controls{width:100%;max-width:1100px;display:flex;gap:12px;flex-wrap:wrap}
.card{background:#fff;border:1px solid #e4e4e4;border-radius:8px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#bbb}

/* background controls */
.bg-card{flex:1;min-width:260px}
.bg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:5px;border:2px solid transparent;cursor:pointer;flex-shrink:0;transition:border-color .12s,transform .1s}
.swatch:hover,.swatch.active{border-color:#333;transform:scale(1.12)}
.collbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;align-self:center}
.colorwrap{width:38px;height:28px;border-radius:5px;border:1px solid #ccc;overflow:hidden;cursor:pointer;flex-shrink:0}
.colorwrap input[type=color]{width:54px;height:44px;margin:-8px;padding:0;border:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#333;font-size:12px;cursor:pointer;transition:background .12s;white-space:nowrap}
.btn:hover{background:#f2f2f2}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* cut-outs */
.cuts-card{flex:2;min-width:300px}
.slots{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.slotbox{
  width:54px;height:62px;
  border:1.5px dashed #ddd;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:#fafafa;overflow:hidden;
  transition:border-color .12s,background .12s;
}
.slotbox:hover{border-color:#777;background:#f0f0f0}
.slotbox.filled{border-style:solid;border-color:#ccc}
.slotbox img{max-width:100%;max-height:100%;object-fit:contain;display:block;transform:scale(var(--thumb-zoom,1));transform-origin:center}
.slotbox .plus{font-size:20px;color:#ccc;line-height:1}
.slotnum{font-size:10px;color:#bbb}

/* size row */
.sizerow{display:flex;align-items:center;gap:8px;margin-top:2px}
.sizerow input[type=range]{flex:1;accent-color:#444;cursor:pointer}
.sizeval{font-size:11px;color:#888;width:38px;text-align:right}
.rowlbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#aaa;width:44px;flex:none}
</style>
</head>
<body>

<!-- ── Stage: just a background + floating cut-outs ── -->
<div class="stage" id="stage">
  <img id="stageBg" alt="">
  <div class="dropz" id="dropZone"></div>
  <div class="cur" id="C0"><img alt=""></div>
  <div class="cur" id="C1"><img alt=""></div>
  <div class="cur" id="C2"><img alt=""></div>
  <div class="cur" id="C3"><img alt=""></div>
  <div class="cur" id="C4"><img alt=""></div>
</div>

<!-- ── Controls ── -->
<div class="controls">

  <!-- Background -->
  <div class="card bg-card">
    <span class="label">Background</span>
    <div class="bg-row">
      <span class="collbl">any colour&nbsp;&rarr;</span>
      <div class="colorwrap" title="Pick any colour">
        <input type="color" id="colorPicker" value="#ffb6c1">
      </div>
      <!-- color / gradient presets -->
      <div id="swatches" style="display:flex;gap:5px;flex-wrap:wrap">
        <div class="swatch active" data-v="pink"                                                              title="Pink"    style="background:pink"></div>
        <div class="swatch"        data-v="linear-gradient(180deg,#4fa8d5,#a8d8f0 55%,#e8f4fb)"              title="Sky"     style="background:linear-gradient(180deg,#4fa8d5,#a8d8f0 55%,#e8f4fb)"></div>
        <div class="swatch"        data-v="linear-gradient(180deg,#f97316,#fb923c 45%,#fcd34d)"              title="Sunset"  style="background:linear-gradient(180deg,#f97316,#fb923c 45%,#fcd34d)"></div>
        <div class="swatch"        data-v="linear-gradient(180deg,#06052e,#1a1050 60%,#2d1b69)"              title="Night"   style="background:linear-gradient(180deg,#06052e,#1a1050 60%,#2d1b69)"></div>
        <div class="swatch"        data-v="linear-gradient(180deg,#c9b99a,#e0d0b5)"                          title="Sand"    style="background:linear-gradient(180deg,#c9b99a,#e0d0b5)"></div>
        <div class="swatch"        data-v="linear-gradient(180deg,#d9d9d9,#f0f0f0)"                          title="Fog"     style="background:linear-gradient(180deg,#d9d9d9,#f0f0f0)"></div>
      </div>
      <!-- upload image as background -->
      <button class="btn" id="btnBg" style="margin-left:auto">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload image
      </button>
    </div>
  </div>

  <!-- Cut-outs -->
  <div class="card cuts-card">
    <span class="label">Cut-out objects — click each slot</span>
    <div class="slots" id="slotsGrid"></div>
    <div class="sizerow">
      <span class="rowlbl">size</span>
      <input type="range" id="sizeSlider" min="3" max="45" value="12">
      <span class="sizeval" id="sizeVal">12%</span>
    </div>
    <div class="sizerow">
      <span class="rowlbl">follow</span>
      <input type="range" id="followSlider" min="15" max="140" value="45">
      <span class="sizeval" id="followVal">0.45</span>
    </div>
    <div class="sizerow">
      <span class="rowlbl">zoom</span>
      <input type="range" id="zoomSlider" min="100" max="320" value="100">
      <span class="sizeval" id="zoomVal">1.0×</span>
    </div>
  </div>

</div>

<input type="file" id="bgFile"  accept="image/*" style="display:none">
<input type="file" id="cutFile" accept="image/*" style="display:none">

<script>
(function(){

/* ── Cursor animation ── */
const stage = document.getElementById('stage');
const N = 5;
const curs = Array.from({length:N}, (_,i) => document.getElementById('C'+i));
const pos  = Array.from({length:N}, () => ({x:-300,y:-300}));
const lf   = [0.38, 0.20, 0.15, 0.11, 0.08];
let mx=-300, my=-300, sizePct=12, followK=0.45;

stage.addEventListener('mousemove', e=>{
  const r=stage.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top;
});
stage.addEventListener('mouseleave', ()=>{ mx=my=-300; });

(function loop(){
  const last=N-1;
  pos[last].x+=(mx-pos[last].x)*lf[0]*followK; pos[last].y+=(my-pos[last].y)*lf[0]*followK;
  for(let i=last-1;i>=0;i--){ pos[i].x+=(pos[i+1].x-pos[i].x)*lf[last-i]*followK; pos[i].y+=(pos[i+1].y-pos[i].y)*lf[last-i]*followK; }
  curs.forEach((c,i)=>{ c.style.left=pos[i].x+'px'; c.style.top=pos[i].y+'px'; });
  requestAnimationFrame(loop);
})();

/* ── Size (relative to the frame) ── */
const slider=document.getElementById('sizeSlider');
const sizeVal=document.getElementById('sizeVal');
function applySize(){
  const px=Math.max(4, Math.round(sizePct/100 * Math.min(stage.clientWidth, stage.clientHeight)));
  sizeVal.textContent=sizePct+'%';
  curs.forEach(c=>{ const img=c.querySelector('img'); img.style.width=px+'px'; img.style.height=px+'px'; });
}
slider.addEventListener('input', ()=>{ sizePct=+slider.value; applySize(); });
applySize();
window.addEventListener('resize', applySize);

/* ── Follow speed (low = strung-out line, high = tight clump) ── */
const followSlider=document.getElementById('followSlider');
const followVal=document.getElementById('followVal');
followSlider.addEventListener('input', ()=>{ followK=+followSlider.value/100; followVal.textContent=followK.toFixed(2); });

/* ── Zoom (enlarge the image content inside its box + cursor) ── */
const zoomSlider=document.getElementById('zoomSlider');
const zoomVal=document.getElementById('zoomVal');
zoomSlider.addEventListener('input', ()=>{
  const z=+zoomSlider.value/100;
  document.documentElement.style.setProperty('--thumb-zoom', z);
  zoomVal.textContent=z.toFixed(1)+'×';
});

/* ── File util ── */
function readURL(file,cb){ const r=new FileReader(); r.onload=e=>cb(e.target.result); r.readAsDataURL(file); }

/* ── Background ── */
const stageBg = document.getElementById('stageBg');
const stagEl  = document.getElementById('stage');

function applyBgColor(val){
  stageBg.style.display='none';
  stagEl.style.background=val;
}
function applyBgImage(url){
  stageBg.src=url;
  stageBg.style.display='block';
  stagEl.style.background='#333';
  stagEl.classList.add('has-bg');   // disable click-to-upload on the stage itself
  clearActiveSwatches();
}
function clearActiveSwatches(){
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
}

// initial
applyBgColor('pink');

document.querySelectorAll('.swatch').forEach(sw=>{
  sw.addEventListener('click',()=>{
    applyBgColor(sw.dataset.v);
    clearActiveSwatches();
    sw.classList.add('active');
    document.getElementById('colorPicker').value='#ffb6c1';
  });
});

document.getElementById('colorPicker').addEventListener('input', e=>{
  applyBgColor(e.target.value);
  clearActiveSwatches();
});

document.getElementById('btnBg').onclick=()=>document.getElementById('bgFile').click();
document.getElementById('bgFile').onchange=e=>{
  if(e.target.files[0]) readURL(e.target.files[0], applyBgImage);
  e.target.value='';
};

// drag & drop onto stage
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover', e=>{e.preventDefault(); dz.classList.add('over');});
dz.addEventListener('dragleave', ()=>dz.classList.remove('over'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('over');
  if(e.dataTransfer.files[0]) readURL(e.dataTransfer.files[0], applyBgImage);
});
dz.addEventListener('click', ()=>document.getElementById('bgFile').click());

/* ── Cut-out slots ── */
const defaultSrcs=[
  'https://aaa.designforthe.net/content/projects/0-brigitte-breaux/6.png',
  'https://aaa.designforthe.net/content/projects/0-brigitte-breaux/5.png',
  'https://aaa.designforthe.net/content/projects/0-brigitte-breaux/4.png',
  'https://aaa.designforthe.net/content/projects/0-brigitte-breaux/3.png',
  'https://aaa.designforthe.net/content/projects/0-brigitte-breaux/2.png',
];
let pendingSlot=null;
const cutFile=document.getElementById('cutFile');
const slotsGrid=document.getElementById('slotsGrid');

// pre-load defaults into cursor elements
defaultSrcs.forEach((src,i)=>{
  const img=curs[i].querySelector('img');
  img.src=src;
});

function applySlot(i, file){
  readURL(file, url=>{
    // update slot thumbnail
    const box=document.getElementById('sb'+i);
    let thumb=box.querySelector('img');
    if(!thumb){ thumb=document.createElement('img'); thumb.alt=''; box.appendChild(thumb); }
    thumb.src=url; thumb.style.display='';
    box.classList.add('filled');
    box.querySelector('.plus').style.display='none';
    // update cursor
    const ci=curs[i].querySelector('img');
    ci.src=url; applySize();
  });
}

for(let i=0;i<N;i++){
  const wrap=document.createElement('div'); wrap.className='slot';
  const box=document.createElement('div');  box.className='slotbox'; box.id='sb'+i;

  // load default image as thumbnail
  const thumb=document.createElement('img'); thumb.alt=''; thumb.src=defaultSrcs[i];
  thumb.onload=()=>box.classList.add('filled');
  thumb.onerror=()=>{ thumb.style.display='none'; plus.style.display='block'; };
  box.appendChild(thumb);

  const plus=document.createElement('span'); plus.className='plus'; plus.textContent='+'; plus.style.display='none';
  box.appendChild(plus);

  box.addEventListener('click',()=>{ pendingSlot=i; cutFile.click(); });
  box.addEventListener('dragover', e=>{e.preventDefault(); box.style.borderColor='#555';});
  box.addEventListener('dragleave', ()=>box.style.borderColor='');
  box.addEventListener('drop', e=>{ e.preventDefault(); box.style.borderColor=''; if(e.dataTransfer.files[0]) applySlot(i,e.dataTransfer.files[0]); });

  const num=document.createElement('span'); num.className='slotnum'; num.textContent=i+1;
  wrap.appendChild(box); wrap.appendChild(num); slotsGrid.appendChild(wrap);
}

cutFile.onchange=e=>{
  if(e.target.files[0]&&pendingSlot!==null) applySlot(pendingSlot,e.target.files[0]);
  e.target.value=''; pendingSlot=null;
};

})();
</script>
</body>
</html>
