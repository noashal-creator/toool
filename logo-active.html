<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — open, then the o's spin fonts</title>
<link rel="stylesheet" href="assets/fonts/spikes-font.css">
<style>
:root{ --sc:0.60px; --red:#FE0000; --black:#000; }
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.hint{opacity:.55;font-size:14px}
.replay{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
.replay:hover{background:#383838}

.banner{position:relative;width:calc(1288 * var(--sc));height:calc(396 * var(--sc));background:#560476;overflow:hidden}
.logo{position:absolute;left:50%;top:50%;margin:0;
  transform:translate(-50%,-50%) rotate(-90deg);
  width:calc(418.17 * var(--sc));height:calc(1051.43 * var(--sc))}
.logo .ltr{position:absolute;left:0;width:100%;margin:0;height:calc(201.25 * var(--sc));
  font-family:"ABC Helveesti Spikes Mono Trial","Helvetica Neue",sans-serif;font-weight:400;
  line-height:calc(201.25 * var(--sc));text-align:center;text-transform:uppercase;
  color:var(--red);-webkit-text-stroke:calc(2.46 * var(--sc)) var(--black);paint-order:stroke fill;
  display:flex;align-items:center;justify-content:center}
.logo .lt-t,.logo .lt-l{font-size:calc(478.17 * var(--sc))}
.logo .lt-t{top:calc(22.59 * var(--sc))} .logo .lt-o1{top:calc(223.84 * var(--sc))}
.logo .lt-o2{top:calc(425.09 * var(--sc))} .logo .lt-o3{top:calc(626.34 * var(--sc))}
.logo .lt-l{top:calc(827.59 * var(--sc))}

/* the o "stage" that spins (once the open finishes) — sized so no typeface
   crosses the band */
.logo .o{position:relative;width:100%;height:100%;will-change:transform;
  transition:transform .52s cubic-bezier(.66,0,.22,1)}
.logo .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(380 * var(--sc));backface-visibility:hidden}

/* ── phase 1 · OPEN (the load-in you approved) — letters gather at the T then
   unfurl left→right. Runs once; the JS starts the spinning only after this. */
.logo.is-loading .lt-o1{animation:load-o1 1.8s cubic-bezier(.16,1,.3,1) 0s   both}
.logo.is-loading .lt-o2{animation:load-o2 1.8s cubic-bezier(.16,1,.3,1) .13s both}
.logo.is-loading .lt-o3{animation:load-o3 1.8s cubic-bezier(.16,1,.3,1) .26s both}
.logo.is-loading .lt-l {animation:load-l  1.8s cubic-bezier(.16,1,.3,1) .39s both}
@keyframes load-o1{from{transform:translateY(calc(-201.25 * var(--sc)))}to{transform:translateY(0)}}
@keyframes load-o2{from{transform:translateY(calc(-402.5  * var(--sc)))}to{transform:translateY(0)}}
@keyframes load-o3{from{transform:translateY(calc(-603.75 * var(--sc)))}to{transform:translateY(0)}}
@keyframes load-l {from{transform:translateY(calc(-805    * var(--sc)))}to{transform:translateY(0)}}
</style></head><body>

<div class="banner"><h1 class="logo" id="logo">
  <span class="ltr lt-t">t</span>
  <span class="ltr lt-o1"><span class="o"><span class="face">o</span></span></span>
  <span class="ltr lt-o2"><span class="o"><span class="face">o</span></span></span>
  <span class="ltr lt-o3"><span class="o"><span class="face">o</span></span></span>
  <span class="ltr lt-l">l</span>
</h1></div>
<p class="hint">קודם הלוגו נפתח — ואז ה־o־ים מתחילים להסתובב ולהחליף פונטים בלי הפסקה.</p>
<button class="replay" id="replay">▶ הפעל שוב</button>

<script>
// a curated set of MAXIMALLY DISTINCT faces — one per style so no two O's look
// alike (spiky / geometric / formal-script / heavy / classic-serif / casual /
// high-contrast / slab / brush / engraved / fantasy / mono / calligraphic...).
// Ordered so each font strongly contrasts the one before it.
const FONTS = [
  '"ABC Helveesti Spikes Mono Trial"','Futura','"Snell Roundhand"','Impact','Georgia',
  '"Comic Sans MS"','Didot','"American Typewriter"','"Brush Script MT"','"Arial Black"',
  'Optima','"Bradley Hand"','Copperplate','"Chalkboard SE"','Phosphate','Luminari',
  '"Courier New"','"Party LET"','Skia','"Apple Chancery"','Superclarendon','"Savoye LET"'
];
const N = FONTS.length, font = i => FONTS[((i % N)+N)%N];
const logo = document.getElementById('logo');
const oEls = [...logo.querySelectorAll('.lt-o1 .o, .lt-o2 .o, .lt-o3 .o')];
const faces = oEls.map(o => o.querySelector('.face'));
let gen = 0;                 // bumps every play(); stale callbacks bail out
let timers = [];             // active setInterval ids, cleared on replay

function clearTimers(){ timers.forEach(clearInterval); timers = []; }

// Spin ONE o: a full turn on its own beat, font swapped mid-spin (hidden by the
// rotation → no "jump"). The first tick's CSS transition eases the spin in from
// rest (slow-in), so the spin GROWS out of the letter landing rather than
// snapping on. It keeps its opening font until that first spin carries a new one.
function spinOne(o, F, my, seed){
  let i = seed, turns = 0;
  const tick = () => {
    if (my !== gen) return;
    turns++; o.style.transform = `rotate(${turns * 360}deg)`;
    setTimeout(() => { if (my === gen) F.style.fontFamily = font(i++); }, 260);
  };
  tick();                                  // first spin eases in out of the landing
  return setInterval(tick, 700);           // then keeps going, wild through all fonts
}

function play(){
  const my = ++gen;                 // invalidates every pending stale timer
  clearTimers();
  // reset o's to the spikes font + no rotation for a clean open — transition OFF
  // so the reset snaps instantly instead of spinning back to 0.
  oEls.forEach(o => {
    o.style.transition = 'none';
    o.style.transform = 'rotate(0deg)';
    o.querySelector('.face').style.fontFamily = '';
  });
  void logo.offsetWidth;
  oEls.forEach(o => { o.style.transition = ''; });
  logo.classList.remove('is-loading'); void logo.offsetWidth;
  logo.classList.add('is-loading');   // OPEN plays (both-filled, holds letters in place)

  // CHOREOGRAPHY (professional): the open now runs ~2.2s (slower). The spinning
  // kicks in at roughly its MIDPOINT (~1.05s) — the first half reads as a clean
  // opening (staging), then the o's light up into motion while the word is still
  // settling (overlapping action), lightly staggered so it cascades on.
  const SPIN_AT = [1050, 1160, 1270];   // per-o spin-start (ms) ≈ half of the open
  oEls.forEach((o, k) => {
    setTimeout(() => {
      if (my !== gen) return;
      timers.push(spinOne(o, faces[k], my, k * 11 + 1));
    }, SPIN_AT[k]);
  });
}

document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body></html>
