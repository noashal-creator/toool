<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — מסגרת התמונה העפה</title>
<style>
/* ─────────────────────────────────────────────────────────────────────
   FRAME COMPARISON — option 4 ("נשפכת מהשפה") only.
   Every cell runs the identical animation; the ONLY difference is how the
   flying photo is framed, so the frame is the only thing being judged.
   Runs at 1.6× by default because the frame is easiest to read mid-flight.
   ───────────────────────────────────────────────────────────────────── */
:root{--red:#FE0000;--yellow:#FFFF01;--panel:#FFFF00;--black:#000;
  --bg:#141414;--card:#1e1e1e;--line:#333;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:26px 22px 70px;}
header{max-width:1300px;margin:0 auto 18px;}
h1{margin:0 0 6px;font-size:21px;}
header p{margin:0;color:#8a8a8a;font-size:13.5px;line-height:1.5;}
.controls{max-width:1300px;margin:0 auto 22px;display:flex;gap:10px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;}
.controls .lbl{font-size:12px;color:#8a8a8a;}
button.ctl{font:inherit;font-size:13px;font-weight:600;color:#ddd;cursor:pointer;
  background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:7px 12px;}
button.ctl.on{background:#560476;border-color:#7b1aa3;color:#fff;}
.grid{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;}
.cell{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
.cap{margin:10px 2px 0;font-size:13.5px;font-weight:700;}
.cap small{display:block;font-weight:400;color:#8a8a8a;font-size:12px;margin-top:3px;line-height:1.4;}

.stage{--s:calc(240px / 352);position:relative;
  width:calc(352 * var(--s));height:calc(1080 * var(--s));
  margin:0 auto;overflow:hidden;background:var(--panel);border-radius:8px;}
.panel{position:absolute;inset:0;}

/* copied from styles.css */
.slot{position:absolute;left:calc(24 * var(--s));width:calc(305 * var(--s));
  border-radius:calc(11 * var(--s));background:#fff;overflow:hidden;}
.slot--a{top:calc(139 * var(--s));height:calc(325 * var(--s));}
.slot--b{top:calc(474 * var(--s));height:calc(313 * var(--s));}
.slot__frame{position:absolute;inset:0;width:100%;height:100%;z-index:5;display:block;}
.slot__preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:4;display:block;}
.spoon-rig{position:absolute;left:calc(146.03 * var(--s));top:calc(867.16 * var(--s));
  width:0;height:0;transform-origin:0 0;z-index:20;}
.hand{position:absolute;display:block;left:calc(-10.36 * var(--s));top:calc(-149.29 * var(--s));
  width:calc(73.57 * var(--s));height:calc(251.82 * var(--s));overflow:hidden;
  transform:rotate(90deg);transform-origin:center;z-index:20;}
.hand img{position:absolute;left:-43.59%;top:-0.21%;width:196.15%;height:123.88%;max-width:none;display:block;
  filter:brightness(90%) contrast(110%) saturate(127%);}
.hand-tip{position:absolute;left:calc(-107.03 * var(--s));top:calc(-28.16 * var(--s));
  width:calc(15 * var(--s));height:calc(41 * var(--s));z-index:20;}
.run{position:absolute;left:calc(200 * var(--s));top:calc(806 * var(--s));
  width:calc(121 * var(--s));height:calc(72 * var(--s));display:inline-flex;align-items:center;justify-content:center;
  background:#560476;border:calc(1 * var(--s)) solid var(--black);border-radius:50%;
  transform-origin:calc(-53.97 * var(--s)) calc(61.16 * var(--s));z-index:21;}
.run__label{color:var(--yellow);font-weight:800;text-transform:uppercase;
  font-size:calc(41 * var(--s));line-height:calc(44 * var(--s));}
.bowl{position:absolute;left:calc(57 * var(--s));top:calc(910.16 * var(--s));
  width:calc(240 * var(--s));height:calc(132.69 * var(--s));color:#FE0000;}
.bowl svg{position:absolute;display:block;width:auto;}
.bowl__body{left:0;top:calc(15.55 * var(--s));width:calc(239.64 * var(--s));height:calc(117.14 * var(--s));z-index:22;}
.bowl__rim{left:calc(1 * var(--s));top:0;width:calc(239 * var(--s));height:calc(33 * var(--s));z-index:1;}
.bowl-floor{position:absolute;left:0;top:calc(1042.85 * var(--s));width:100%;height:calc(40 * var(--s));
  background:var(--panel);z-index:24;}

@keyframes rig-descend{
  0%{transform:rotate(0deg);animation-timing-function:steps(1);}
  15%{transform:translateY(calc(-22 * var(--s))) rotate(-7deg);animation-timing-function:steps(1);}
  35%{transform:translateY(calc(-62 * var(--s))) rotate(25deg);animation-timing-function:steps(1);}
  55%{transform:translateY(calc(-88 * var(--s))) rotate(55deg);animation-timing-function:steps(1);}
  72%{transform:translateY(calc(-78 * var(--s))) rotate(78deg);animation-timing-function:steps(1);}
  86%{transform:translateY(calc(-40 * var(--s))) rotate(88deg);animation-timing-function:steps(1);}
  100%{transform:rotate(90.53deg);}
}
@keyframes rig-stir{
  0%{transform:rotate(90.53deg);animation-timing-function:steps(1);}
  22%{transform:rotate(100deg);animation-timing-function:steps(1);}
  46%{transform:rotate(85deg);animation-timing-function:steps(1);}
  58%{transform:rotate(82deg);animation-timing-function:steps(1);}
  82%{transform:rotate(97deg);animation-timing-function:steps(1);}
  100%{transform:rotate(90.53deg);}
}
.is-mixing .spoon-rig,.is-mixing .run{animation:rig-descend 800ms 1 forwards, rig-stir 640ms infinite 800ms;}
.is-mixing .run{border-color:transparent;}
@keyframes bowl-hit{
  0%{transform:translate(0,0) rotate(0deg);}
  22%{transform:translate(0,calc(4 * var(--s))) rotate(-1.4deg);}
  48%{transform:translate(calc(2 * var(--s)),calc(-2 * var(--s))) rotate(1deg);}
  74%{transform:translate(calc(-1 * var(--s)),calc(1 * var(--s))) rotate(-.5deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}
.is-tossing .bowl__rim,.is-tossing .bowl__body{animation:bowl-hit 220ms 1 620ms, bowl-hit 220ms 1 960ms;}

/* the flying photo — geometry identical in every cell */
.toss{position:absolute;left:calc(116.5 * var(--s));
  width:calc(120 * var(--s));height:calc(120 * var(--s));
  object-fit:cover;z-index:10;opacity:0;display:block;--dir:1;}
.toss--a{top:calc(241.5 * var(--s)); --dy:683.5;}
.toss--b{top:calc(570.5 * var(--s)); --dy:354.5; --dir:-1;}
.is-tossing .slot__preview{opacity:0;transition:opacity .1s .08s;}
.is-tossing .toss--a{animation:toss-tip 780ms 1 forwards;}
.is-tossing .toss--b{animation:toss-tip 780ms 1 forwards 340ms;}

/* ══ THE ONLY DIFFERENCE BETWEEN CELLS ════════════════════════════════ */
.f-black  .toss{border:calc(2 * var(--s)) solid var(--black);}
.f-none   .toss{border:0;}
.f-thin   .toss{border:calc(1 * var(--s)) solid var(--black);}
.f-bold   .toss{border:calc(4 * var(--s)) solid var(--black);}
.f-print  .toss{border:calc(5 * var(--s)) solid #fff; outline:calc(1.5 * var(--s)) solid var(--black); outline-offset:calc(-6.5 * var(--s));}

@keyframes toss-tip{
  0%   {opacity:1;transform-origin:50% 100%;transform:translate(0,0) rotate(0deg) scale(1);
        animation-timing-function:cubic-bezier(.5,0,.85,.35);}
  46%  {opacity:1;transform-origin:50% 100%;transform:translate(calc(var(--dir) * 10 * var(--s)), calc(var(--dy) * .82 * var(--s))) rotate(calc(var(--dir) * 6deg)) scale(.72);
        animation-timing-function:cubic-bezier(.3,1.4,.6,1);}
  58%  {opacity:1;transform-origin:50% 100%;transform:translate(calc(var(--dir) * 10 * var(--s)), calc(var(--dy) * .80 * var(--s))) rotate(calc(var(--dir) * -14deg)) scale(.7);
        animation-timing-function:ease-in;}
  72%  {opacity:1;transform-origin:50% 100%;transform:translate(calc(var(--dir) * 4 * var(--s)), calc(var(--dy) * .86 * var(--s))) rotate(calc(var(--dir) * 34deg)) scale(.66);
        animation-timing-function:cubic-bezier(.5,0,.9,.5);}
  100% {opacity:1;transform-origin:50% 100%;transform:translate(0, calc(var(--dy) * var(--s))) rotate(calc(var(--dir) * 8deg)) scale(.55);}
}
</style>
</head>
<body>

<header>
  <h1>אפשרות 4 — איזו מסגרת לתמונה העפה?</h1>
  <p>
    כל התאים מריצים <b>בדיוק את אותה אנימציה</b>. ההבדל היחיד הוא המסגרת של התמונה הנזרקת.
    רץ לאט (×1.6) כי את המסגרת הכי קל לשפוט באמצע התעופה.
    לידיעה: הקערה, הריבועים, הבאדג׳ים והלוגו כולם עם קו מתאר שחור — זו שפת האתר.
  </p>
</header>

<div class="controls">
  <span class="lbl">מהירות:</span>
  <button class="ctl" data-speed="1">רגיל</button>
  <button class="ctl on" data-speed="1.6">איטי</button>
  <button class="ctl" data-speed="2.6">איטי מאוד</button>
  <button class="ctl" id="replay" style="margin-inline-start:auto">הרץ הכל מחדש</button>
</div>

<div class="grid" id="grid"></div>

<template id="scene">
  <div class="panel">
    <div class="slot slot--a">
      <img class="slot__preview" src="assets/object-a.jpg" alt="">
      <svg class="slot__frame" viewBox="0 0 305 325" preserveAspectRatio="none">
        <rect x="0.5" y="0.5" width="304" height="324" rx="10.5" ry="10.5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 5"/></svg>
    </div>
    <div class="slot slot--b">
      <img class="slot__preview" src="assets/object-b.jpg" alt="">
      <svg class="slot__frame" viewBox="0 0 305 313" preserveAspectRatio="none">
        <rect x="0.5" y="0.5" width="304" height="312" rx="10.5" ry="10.5" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="5 5"/></svg>
    </div>
    <img class="toss toss--a" src="assets/object-a.jpg" alt="">
    <img class="toss toss--b" src="assets/object-b.jpg" alt="">
    <div class="spoon-rig">
      <span class="hand"><img src="assets/hand-spoon-raw.png" alt=""></span>
      <img class="hand-tip" src="assets/hand-tip.svg" alt="">
    </div>
    <span class="run"><span class="run__label">mix</span></span>
    <div class="bowl">
      <svg class="bowl__body" preserveAspectRatio="none" overflow="visible" width="239.639" height="117.143" viewBox="0 0 239.639 117.143" fill="none" xmlns="http://www.w3.org/2000/svg">
        <mask id="m" fill="white"><path d="M1.9043 0C1.90523 8.94165 55.4181 16.1904 121.429 16.1904C181.4 16.1904 231.054 10.2061 239.639 2.40625L177.039 117.143H63.9131L0 0H1.9043Z"/></mask>
        <path d="M1.9043 0C1.90523 8.94165 55.4181 16.1904 121.429 16.1904C181.4 16.1904 231.054 10.2061 239.639 2.40625L177.039 117.143H63.9131L0 0H1.9043Z" fill="currentColor"/>
        <path d="M1.9043 0L2.9043 -0.000103812L2.90419 -1H1.9043V0ZM121.429 16.1904V17.1904V17.1904V16.1904ZM239.639 2.40625L240.517 2.8852L238.966 1.66612L239.639 2.40625ZM177.039 117.143V118.143H177.633L177.917 117.622L177.039 117.143ZM63.9131 117.143L63.0352 117.622L63.3195 118.143H63.9131V117.143ZM0 0V-1H-1.68476L-0.877842 0.478951L0 0ZM1.9043 0L0.904297 0.000103812C0.904468 1.64816 2.1244 3.00028 3.78095 4.09678C5.48534 5.22496 7.9342 6.2749 10.9926 7.25437C17.1235 9.21777 25.9427 10.9715 36.7786 12.4393C58.4652 15.3769 88.393 17.1904 121.429 17.1904V16.1904V15.1904C88.4538 15.1904 58.6199 13.3796 37.0471 10.4574C26.2534 8.99529 17.5685 7.26024 11.6026 5.34966C8.6127 4.39213 6.365 3.40877 4.88487 2.42904C3.3569 1.41764 2.90436 0.587255 2.9043 -0.000103812L1.9043 0ZM121.429 16.1904V17.1904C151.443 17.1904 178.89 15.6931 199.921 13.2164C210.434 11.9783 219.363 10.4933 226.217 8.82213C229.643 7.98668 232.569 7.10038 234.923 6.16761C237.259 5.24166 239.106 4.24176 240.311 3.14638L239.639 2.40625L238.966 1.66612C238.026 2.52071 236.442 3.41403 234.186 4.3083C231.947 5.19573 229.116 6.05662 225.743 6.87906C218.998 8.52368 210.157 9.99716 199.687 11.2301C178.751 13.6956 151.385 15.1904 121.429 15.1904V16.1904ZM239.639 2.40625L238.761 1.9273L176.161 116.664L177.039 117.143L177.917 117.622L240.517 2.8852L239.639 2.40625ZM177.039 117.143V116.143H63.9131V117.143V118.143H177.039V117.143ZM63.9131 117.143L64.7909 116.664L0.877842 -0.478951L0 0L-0.877842 0.478951L63.0352 117.622L63.9131 117.143ZM0 0V1H1.9043V0V-1H0V0Z" fill="black" mask="url(#m)"/>
      </svg>
      <svg class="bowl__rim" preserveAspectRatio="none" overflow="visible" width="239" height="33" viewBox="0 0 239 33" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M119.5 0.5C152.483 0.5 182.334 2.34623 203.931 5.32812C214.733 6.8196 223.449 8.59236 229.454 10.5527C232.46 11.534 234.757 12.5528 236.293 13.5889C237.85 14.6396 238.5 15.6216 238.5 16.5C238.5 17.3784 237.85 18.3604 236.293 19.4111C234.757 20.4472 232.46 21.466 229.454 22.4473C223.449 24.4076 214.733 26.1804 203.931 27.6719C182.334 30.6538 152.483 32.5 119.5 32.5C86.5166 32.5 56.6656 30.6538 35.0693 27.6719C24.2675 26.1804 15.5511 24.4076 9.5459 22.4473C6.53996 21.466 4.24256 20.4472 2.70703 19.4111C1.14985 18.3604 0.5 17.3784 0.5 16.5C0.5 15.6216 1.14985 14.6396 2.70703 13.5889C4.24256 12.5528 6.53996 11.534 9.5459 10.5527C15.5511 8.59236 24.2675 6.8196 35.0693 5.32812C56.6656 2.34623 86.5166 0.5 119.5 0.5Z" fill="currentColor" stroke="black"/>
      </svg>
    </div>
    <div class="bowl-floor"></div>
  </div>
</template>

<script>
const FRAMES = [
  { cls:'f-black', title:'א · שחורה 2 יח׳ (הנוכחית)', note:'מה שראית. מתיישב עם קו המתאר של הקערה והריבועים.' },
  { cls:'f-none',  title:'ב · בלי מסגרת בכלל',        note:'התמונה נקייה. חסרון: על הצהוב היא נראית "מרחפת" בלי לעגן.' },
  { cls:'f-thin',  title:'ג · שחורה דקה (1 יח׳)',      note:'אותו רעיון, עדין יותר — קרוב לעובי הקו של הקערה עצמה.' },
  { cls:'f-bold',  title:'ד · שחורה עבה (4 יח׳)',      note:'גרפי ובוטה, כמו קולאז׳ גזור. הכי "נוכח".' },
  { cls:'f-print', title:'ה · לבנה עם קו שחור',        note:'כמו תמונה מודפסת/פולרואיד. מפריד את התמונה מהצהוב.' },
];

const TOSS_MS=780, TOSS_B_DELAY=340, DESCEND_MS=800, WATCH_MS=2200, GAP=800;
let speed=1.6;
const grid=document.getElementById('grid'), tpl=document.getElementById('scene'), stages=[];

for(const f of FRAMES){
  const cell=document.createElement('figure'); cell.className='cell';
  const stage=document.createElement('div');
  stage.className='stage '+f.cls;
  stage.appendChild(tpl.content.cloneNode(true));
  const cap=document.createElement('figcaption'); cap.className='cap';
  cap.innerHTML=`${f.title}<small>${f.note}</small>`;
  cell.append(stage,cap); grid.appendChild(cell); stages.push(stage);
}

function clearTimers(s){(s._t||[]).forEach(clearTimeout);s._t=[];}
function runCycle(s){
  clearTimers(s);
  s.classList.remove('is-tossing','is-mixing');
  void s.offsetWidth;
  s.classList.add('is-tossing');
  s._t=[];
  const total=TOSS_B_DELAY+TOSS_MS;
  s._t.push(setTimeout(()=>s.classList.add('is-mixing'), total*speed));
  s._t.push(setTimeout(()=>{
    s.classList.remove('is-tossing','is-mixing');
    s._t.push(setTimeout(()=>runCycle(s),GAP));
  },(total+DESCEND_MS+WATCH_MS)*speed));
}
function applySpeed(){
  stages.forEach(s=>{
    s.querySelectorAll('.toss').forEach(t=>t.style.animationDuration=(TOSS_MS*speed)+'ms');
    s.querySelectorAll('.toss--b').forEach(t=>t.style.animationDelay=(TOSS_B_DELAY*speed)+'ms');
    s.querySelectorAll('.bowl__rim,.bowl__body').forEach(el=>{
      el.style.animationDuration=(220*speed)+'ms, '+(220*speed)+'ms';
      el.style.animationDelay=(620*speed)+'ms, '+(960*speed)+'ms';
    });
  });
}
function restartAll(){applySpeed();stages.forEach(runCycle);}
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{
  speed=Number(b.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach(o=>o.classList.toggle('on',o===b));
  restartAll();
}));
document.getElementById('replay').addEventListener('click',restartAll);
restartAll();
</script>
</body>
</html>
