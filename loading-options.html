<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — אפשרויות פידבק טעינה</title>
<style>
/* ─────────────────────────────────────────────────────────────────────
   OPTIONS GALLERY — "loading / ready" feedback
   Standalone. Touches nothing in index.html / styles.css / app.js.

   Every cell renders the REAL bowl + spoon rig: all the .spoon-rig /
   .hand / .run / .bowl / .bowl-fill rules below are copied verbatim from
   styles.css, and the bowl SVGs are the same inlined currentColor markup
   index.html now uses. Because every length in that system is
   `design-unit × var(--s)`, a cell only has to set its own --s to
   reproduce the sidebar exactly at any size.

   Each cell is a 352×380-unit window onto the 352×1080 panel, shifted up
   by 700 units — a landscape crop of just the hand + bowl.
   ───────────────────────────────────────────────────────────────────── */

:root{
  --red:#FE0000; --yellow:#FFFF01; --panel:#FFFF00; --black:#000;
  --purple:#560476;
  --bg:#141414; --card:#1e1e1e; --line:#333;
}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  padding:28px 24px 80px;
}
header{max-width:1100px;margin:0 auto 22px;}
h1{margin:0 0 6px;font-size:22px;}
header p{margin:0;color:#8a8a8a;font-size:14px;line-height:1.5;}

.controls{
  max-width:1100px;margin:0 auto 26px;display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;
}
.controls .grp{display:flex;gap:6px;align-items:center;}
.controls .lbl{font-size:12px;color:#8a8a8a;margin-inline-end:2px;}
button.ctl{
  font:inherit;font-size:13px;font-weight:600;color:#ddd;cursor:pointer;
  background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:7px 12px;
}
button.ctl:hover{background:#343434;}
button.ctl.on{background:#560476;border-color:#7b1aa3;color:#fff;}

.grid{
  max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:22px;
}
.cell{margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
.cap{margin:12px 2px 0;font-size:14px;font-weight:700;}
.cap small{display:block;font-weight:400;color:#8a8a8a;font-size:12.5px;margin-top:3px;line-height:1.45;}

/* ══ the crop window ═══════════════════════════════════════════════════ */
.stage{
  --s: calc(410px / 352);          /* the whole sidebar system scales off this */
  position:relative;
  width:calc(352 * var(--s));
  height:calc(380 * var(--s));     /* design-y 700 → 1080 */
  margin:0 auto;
  overflow:hidden;
  background:var(--panel);
  border-radius:8px;
}
.panel{
  position:absolute; left:0; top:calc(-700 * var(--s));
  width:calc(352 * var(--s)); height:calc(1080 * var(--s));
}

/* ══════════════════════════════════════════════════════════════════════
   COPIED VERBATIM FROM styles.css — do not "improve" here; this exists so
   the preview is the real thing. Only difference: .run is class-based
   (#run would have to be unique, and there are six cells).
   ══════════════════════════════════════════════════════════════════════ */
.spoon-rig{
  position:absolute;
  left:calc(146.03 * var(--s));
  top:calc(867.16 * var(--s));
  width:0;height:0;
  transform-origin:0 0;
  z-index:20;
  animation:rig-idle 2400ms infinite;
}
.hand{
  position:absolute;display:block;
  left:calc(-10.36 * var(--s));
  top:calc(-149.29 * var(--s));
  width:calc(73.57 * var(--s));
  height:calc(251.82 * var(--s));
  overflow:hidden;
  transform:rotate(90deg);
  transform-origin:center;
  pointer-events:none;user-select:none;
  z-index:20;
}
.hand img{position:absolute;left:-43.59%;top:-0.21%;width:196.15%;height:123.88%;max-width:none;display:block;}
.hand-tip{
  position:absolute;
  left:calc(-107.03 * var(--s));
  top:calc(-28.16 * var(--s));
  width:calc(15 * var(--s));
  height:calc(41 * var(--s));
  pointer-events:none;user-select:none;
  z-index:20;
}
.run{
  position:absolute;
  left:calc(200 * var(--s));
  top:calc(806 * var(--s));
  width:calc(121 * var(--s));
  height:calc(72 * var(--s));
  display:inline-flex;align-items:center;justify-content:center;padding:0;
  background:#560476;
  border:calc(1 * var(--s)) solid var(--black);
  border-radius:50%;
  transform-origin:calc(-53.97 * var(--s)) calc(61.16 * var(--s));
  animation:rig-idle 2400ms infinite;
  z-index:21;
}
.run__label{
  color:var(--yellow);font-weight:800;text-transform:uppercase;
  font-size:calc(41 * var(--s));line-height:calc(44 * var(--s));
  pointer-events:none;
}
.bowl{
  position:absolute;
  left:calc(57 * var(--s));
  top:calc(910.16 * var(--s));
  width:calc(240 * var(--s));
  height:calc(132.69 * var(--s));
  pointer-events:none;
  color:#FE0000;
}
.bowl svg{position:absolute;display:block;width:auto;}
.bowl__body{left:0;top:calc(15.55 * var(--s));width:calc(239.64 * var(--s));height:calc(117.14 * var(--s));z-index:22;}
.bowl__rim{left:calc(1 * var(--s));top:0;width:calc(239 * var(--s));height:calc(33 * var(--s));z-index:1;}
.bowl-fill{
  position:absolute;
  left:calc(57 * var(--s));
  top:calc(925.71 * var(--s));
  width:calc(239.64 * var(--s));
  height:calc(117.14 * var(--s));
  overflow:hidden;
  clip-path:polygon(
    1.2% 0.9%, 4.7% 6.3%, 15.4% 10.7%, 31.3% 13.6%, 50.7% 14.7%,
    68.4% 13.8%, 83.4% 11.3%, 94.3% 7.6%, 99.4% 3.0%,
    73.5% 99.1%, 27.05% 99.1%
  );
  z-index:23;
  pointer-events:none;
}
.bowl-fill__level{position:absolute;left:0;right:0;bottom:0;height:0;background:#560476;display:block;}
.bowl-floor{
  position:absolute;left:0;top:calc(1042.85 * var(--s));
  width:100%;height:calc(40 * var(--s));
  background:var(--panel);z-index:24;pointer-events:none;
}

@keyframes rig-idle{
  0%,70%{transform:rotate(0deg);animation-timing-function:steps(1);}
  74%{transform:rotate(-2.5deg);animation-timing-function:steps(1);}
  78%{transform:rotate(2.5deg);animation-timing-function:steps(1);}
  82%{transform:rotate(-2deg);animation-timing-function:steps(1);}
  86%{transform:rotate(1.5deg);animation-timing-function:steps(1);}
  90%{transform:rotate(-1deg);animation-timing-function:steps(1);}
  94%,100%{transform:rotate(0deg);}
}
@keyframes rig-descend{
  0%{transform:rotate(0deg);animation-timing-function:steps(1);}
  15%{transform:translateY(calc(-22 * var(--s))) rotate(-7deg);animation-timing-function:steps(1);}
  35%{transform:translateY(calc(-62 * var(--s))) rotate(25deg);animation-timing-function:steps(1);}
  55%{transform:translateY(calc(-88 * var(--s))) rotate(55deg);animation-timing-function:steps(1);}
  72%{transform:translateY(calc(-78 * var(--s))) rotate(78deg);animation-timing-function:steps(1);}
  86%{transform:translateY(calc(-40 * var(--s))) rotate(88deg);animation-timing-function:steps(1);}
  100%{transform:rotate(90.53deg);}
}
@keyframes rig-stir{
  0%{transform:rotate(90.53deg);animation-timing-function:steps(1);}
  10%{transform:rotate(98deg);animation-timing-function:steps(1);}
  22%{transform:rotate(100deg);animation-timing-function:steps(1);}
  34%{transform:rotate(95deg);animation-timing-function:steps(1);}
  46%{transform:rotate(85deg);animation-timing-function:steps(1);}
  58%{transform:rotate(82deg);animation-timing-function:steps(1);}
  70%{transform:rotate(86deg);animation-timing-function:steps(1);}
  82%{transform:rotate(97deg);animation-timing-function:steps(1);}
  92%{transform:rotate(93deg);animation-timing-function:steps(1);}
  100%{transform:rotate(90.53deg);}
}
@keyframes bowl-jiggle{
  0%{transform:translateX(0);animation-timing-function:steps(1);}
  22%{transform:translateX(calc(-2.5 * var(--s)));animation-timing-function:steps(1);}
  46%{transform:translateX(calc(1 * var(--s)));animation-timing-function:steps(1);}
  58%{transform:translateX(calc(2.5 * var(--s)));animation-timing-function:steps(1);}
  82%{transform:translateX(calc(-1.5 * var(--s)));animation-timing-function:steps(1);}
  100%{transform:translateX(0);}
}
@keyframes bowl-load{ from{height:0;} to{height:100%;} }

/* ══ NEW — the ending beat being previewed ════════════════════════════
   rig-lift is rig-descend reversed: the spoon rises back out along the
   same up-and-over arc, in the same stepped stop-motion language, and
   lands on exactly rotate(0deg) — the idle base — so the idle wiggle can
   resume with no snap. This is what replaces today's one-frame teleport. */
@keyframes rig-lift{
  0%{transform:rotate(90.53deg);animation-timing-function:steps(1);}
  16%{transform:translateY(calc(-40 * var(--s))) rotate(88deg);animation-timing-function:steps(1);}
  32%{transform:translateY(calc(-78 * var(--s))) rotate(78deg);animation-timing-function:steps(1);}
  50%{transform:translateY(calc(-88 * var(--s))) rotate(55deg);animation-timing-function:steps(1);}
  70%{transform:translateY(calc(-62 * var(--s))) rotate(25deg);animation-timing-function:steps(1);}
  86%{transform:translateY(calc(-22 * var(--s))) rotate(-7deg);animation-timing-function:steps(1);}
  100%{transform:rotate(0deg);}
}
/* the pill's outline is hidden while it is down inside the bowl (it would
   show as a stray ring through the bowl's notch); it comes back once the
   lift has carried it clear. Runs alongside rig-lift at the same duration —
   the ONLY property it touches is border-color, never a transform, so the
   rig and the pill stay geometrically locked. */
@keyframes run-border-return{
  0%,35%{border-color:transparent;}
  36%,100%{border-color:var(--black);}
}
@keyframes bowl-drain{ from{height:100%;} to{height:0;} }

/* ══ state wiring (per cell) ══════════════════════════════════════════ */
.is-mixing .spoon-rig,
.is-mixing .run{ animation:rig-descend 800ms 1 forwards, rig-stir 640ms infinite 800ms; }
.is-mixing .run{ border-color:transparent; }
.is-mixing .bowl__rim,
.is-mixing .bowl__body,
.is-mixing .bowl-fill{ animation:bowl-jiggle 640ms infinite 800ms; }
.is-mixing .bowl-fill__level{ animation:bowl-load var(--fill-ms,8200ms) linear 800ms forwards; }

.is-done .spoon-rig{ animation:rig-lift 600ms 1 forwards; }
.is-done .run{ animation:rig-lift 600ms 1 forwards, run-border-return 600ms 1 forwards; }
.is-done .bowl-fill__level{ height:100%; }          /* the bowl stays full */
.is-draining .bowl-fill__level{ height:0; animation:bowl-drain 520ms linear forwards; }

/* ══ variant overlays ═════════════════════════════════════════════════ */
.fb{
  position:absolute;left:calc(57 * var(--s));width:calc(240 * var(--s));
  text-align:center;font-weight:800;text-transform:uppercase;
  z-index:26;pointer-events:none;line-height:1;
  opacity:0;transition:opacity .15s;
}
.is-mixing .fb, .is-done .fb, .is-draining .fb{ opacity:1; }
.fb__ready{display:none;}
.is-done .fb__num, .is-draining .fb__num{display:none;}
.is-done .fb__ready, .is-draining .fb__ready{display:block;}

/* 1 — % inside the bowl */
.fb--in{ top:calc(972 * var(--s)); font-size:calc(40 * var(--s)); color:var(--yellow);
         -webkit-text-stroke:calc(1 * var(--s)) var(--black); }
/* 2 — % under the bowl (never touches the drawing) */
.fb--under{ top:calc(1050 * var(--s)); font-size:calc(26 * var(--s)); color:var(--black); }
/* 3 — words only */
.fb--word{ top:calc(1050 * var(--s)); font-size:calc(24 * var(--s)); color:var(--black); }
.dots::after{ content:''; animation:dots 1.2s steps(1) infinite; }
@keyframes dots{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%,100%{content:'...';} }

/* 4 — measuring marks. Sit INSIDE .bowl-fill, before the level in the DOM,
       so the rising purple swallows each mark as it passes it — a real
       measuring-cup read. The clip-path crops them to the bowl's shape. */
.tick{position:absolute;height:calc(2.6 * var(--s));background:var(--black);opacity:.8;}
.tick i{position:absolute;inset-inline-start:calc(34 * var(--s));top:calc(-9 * var(--s));
        font-style:normal;font-size:calc(15 * var(--s));font-weight:800;color:var(--black);}
/* left wall runs (0,0)→(63.913,117.143): x = f × 63.913 */
.tick--25{ top:25%;  left:calc(19.98 * var(--s)); width:calc(30 * var(--s)); }
.tick--50{ top:50%;  left:calc(35.96 * var(--s)); width:calc(30 * var(--s)); }
.tick--75{ top:75%;  left:calc(51.93 * var(--s)); width:calc(30 * var(--s)); }

/* 5 — motion only: one pulse of the bowl when it lands */
.is-done .pulse-bowl .bowl__body,
.is-done .pulse-bowl .bowl__rim{ animation:bowl-pulse 420ms steps(1) 1; }
@keyframes bowl-pulse{ 0%,100%{filter:none;} 33%{filter:brightness(1.35);} 66%{filter:none;} }

/* 6 — completion stamp */
.stamp{
  position:absolute;left:calc(84 * var(--s));top:calc(958 * var(--s));
  width:calc(186 * var(--s));
  background:#560476;border:calc(2 * var(--s)) solid var(--black);
  border-radius:calc(6 * var(--s));
  color:var(--yellow);font-weight:800;text-transform:uppercase;text-align:center;
  font-size:calc(30 * var(--s));line-height:calc(46 * var(--s));
  transform:rotate(-7deg) scale(0);
  z-index:26;pointer-events:none;
}
.is-done .stamp,.is-draining .stamp{ animation:stamp-pop 360ms steps(1) 1 forwards; }
@keyframes stamp-pop{
  0%{transform:rotate(-7deg) scale(0);}
  35%{transform:rotate(-7deg) scale(1.18);}
  70%{transform:rotate(-7deg) scale(.94);}
  100%{transform:rotate(-7deg) scale(1);}
}
</style>
</head>
<body>

<header>
  <h1>אפשרויות פידבק: "נטען" ← "מוכן"</h1>
  <p>
    כל התאים מריצים את <b>אותו סוף מתוקן</b> — המפלס מתמלא, רגע עצירה, הכף <b>עולה מהקערה</b>
    בקשת סטופ-מושן, ורק אז מגיע סימן ה"מוכן" (באתר האמיתי כאן ייפתח החלון).
    ההבדל בין התאים הוא <b>רק</b> איך מוסבר שזה נטען ושזה מוכן. בחרי מספר.
  </p>
</header>

<div class="controls">
  <span class="lbl">הקערה בסוף:</span>
  <div class="grp">
    <button class="ctl on" data-end="hold">נשארת מלאה</button>
    <button class="ctl" data-end="drain">מתרוקנת בהדרגה</button>
  </div>
  <span class="lbl" style="margin-inline-start:14px">מהירות:</span>
  <div class="grp">
    <button class="ctl on" data-speed="3600">תצוגה מהירה</button>
    <button class="ctl" data-speed="8200">מהירות אמיתית (9 שנ׳)</button>
  </div>
  <button class="ctl" id="replay" style="margin-inline-start:auto">הרץ הכל מחדש</button>
</div>

<div class="grid" id="grid"></div>

<template id="scene">
  <div class="panel">
    <div class="spoon-rig">
      <span class="hand"><img src="assets/hand-spoon-raw.png" alt=""></span>
      <img class="hand-tip" src="assets/hand-tip.svg" alt="">
    </div>
    <span class="run"><span class="run__label">mix</span></span>

    <div class="bowl">
      <svg class="bowl__body" preserveAspectRatio="none" overflow="visible" width="239.639" height="117.143" viewBox="0 0 239.639 117.143" fill="none" xmlns="http://www.w3.org/2000/svg">
        <mask id="m" fill="white"><path d="M1.9043 0C1.90523 8.94165 55.4181 16.1904 121.429 16.1904C181.4 16.1904 231.054 10.2061 239.639 2.40625L177.039 117.143H63.9131L0 0H1.9043Z"/></mask>
        <path d="M1.9043 0C1.90523 8.94165 55.4181 16.1904 121.429 16.1904C181.4 16.1904 231.054 10.2061 239.639 2.40625L177.039 117.143H63.9131L0 0H1.9043Z" fill="currentColor"/>
        <path d="M1.9043 0L2.9043 -0.000103812L2.90419 -1H1.9043V0ZM121.429 16.1904V17.1904V17.1904V16.1904ZM239.639 2.40625L240.517 2.8852L238.966 1.66612L239.639 2.40625ZM177.039 117.143V118.143H177.633L177.917 117.622L177.039 117.143ZM63.9131 117.143L63.0352 117.622L63.3195 118.143H63.9131V117.143ZM0 0V-1H-1.68476L-0.877842 0.478951L0 0ZM1.9043 0L0.904297 0.000103812C0.904468 1.64816 2.1244 3.00028 3.78095 4.09678C5.48534 5.22496 7.9342 6.2749 10.9926 7.25437C17.1235 9.21777 25.9427 10.9715 36.7786 12.4393C58.4652 15.3769 88.393 17.1904 121.429 17.1904V16.1904V15.1904C88.4538 15.1904 58.6199 13.3796 37.0471 10.4574C26.2534 8.99529 17.5685 7.26024 11.6026 5.34966C8.6127 4.39213 6.365 3.40877 4.88487 2.42904C3.3569 1.41764 2.90436 0.587255 2.9043 -0.000103812L1.9043 0ZM121.429 16.1904V17.1904C151.443 17.1904 178.89 15.6931 199.921 13.2164C210.434 11.9783 219.363 10.4933 226.217 8.82213C229.643 7.98668 232.569 7.10038 234.923 6.16761C237.259 5.24166 239.106 4.24176 240.311 3.14638L239.639 2.40625L238.966 1.66612C238.026 2.52071 236.442 3.41403 234.186 4.3083C231.947 5.19573 229.116 6.05662 225.743 6.87906C218.998 8.52368 210.157 9.99716 199.687 11.2301C178.751 13.6956 151.385 15.1904 121.429 15.1904V16.1904ZM239.639 2.40625L238.761 1.9273L176.161 116.664L177.039 117.143L177.917 117.622L240.517 2.8852L239.639 2.40625ZM177.039 117.143V116.143H63.9131V117.143V118.143H177.039V117.143ZM63.9131 117.143L64.7909 116.664L0.877842 -0.478951L0 0L-0.877842 0.478951L63.0352 117.622L63.9131 117.143ZM0 0V1H1.9043V0V-1H0V0Z" fill="black" mask="url(#m)"/>
      </svg>
      <svg class="bowl__rim" preserveAspectRatio="none" overflow="visible" width="239" height="33" viewBox="0 0 239 33" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </div>

    <div class="bowl-fill"><span class="bowl-fill__level"></span></div>
    <div class="bowl-floor"></div>
  </div>
</template>

<script>
const VARIANTS = [
  { id:'in',    title:'1 · אחוזים בתוך הקערה',
    note:'מספר גדול צהוב על הסגול, עולה יחד עם המפלס, ובסוף מתחלף ל־READY. הכי חד־משמעי — מספר אומר "טעינה" בלי להסביר.',
    fb:'<div class="fb fb--in"><span class="fb__num">0%</span><span class="fb__ready">ready</span></div>' },

  { id:'under', title:'2 · אחוזים מתחת לקערה',
    note:'אותו מונה, אבל כשורה מתחת לציור — לא נוגע באיור של הקערה בכלל.',
    fb:'<div class="fb fb--under"><span class="fb__num">0%</span><span class="fb__ready">ready</span></div>' },

  { id:'word',  title:'3 · מילים בלבד',
    note:'בלי מספרים: MIXING עם נקודות רצות, ובסוף READY! — רך יותר, אבל לא מרמז כמה זמן נשאר.',
    fb:'<div class="fb fb--word"><span class="fb__num dots">mixing</span><span class="fb__ready">ready!</span></div>' },

  { id:'ticks', title:'4 · סימוני מדידה על הקערה',
    note:'הקערה הופכת לכוס מדידה: המפלס "בולע" כל סימון שהוא עובר. קריאת התקדמות בלי טקסט חיצוני.',
    fb:'', ticks:true },

  { id:'motion',title:'5 · בלי טקסט — תנועה בלבד',
    note:'רק הסוף המתוקן: הכף עולה, הקערה נשארת מלאה, והקערה מהבהבת פעם אחת. זו בדיוק האפשרות שעליה הייתה הביקורת — כאן אפשר לשפוט אותה מול השאר.',
    fb:'', pulse:true },

  { id:'stamp', title:'6 · חותמת "מוכן" בסוף',
    note:'המילוי נקי בלי טקסט, ובסוף חותמת READY קופצת מעל הקערה בקפיצה סטופ־מושן.',
    fb:'<div class="stamp">ready</div>' },
];

const DESCEND = 800, LIFT = 600, READY_HOLD = 1800, GAP = 700;
let fillMs = 3600;
let endMode = 'hold';

const grid = document.getElementById('grid');
const tpl  = document.getElementById('scene');
const stages = [];

for (const v of VARIANTS) {
  const cell = document.createElement('figure');
  cell.className = 'cell';

  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.dataset.id = v.id;
  stage.appendChild(tpl.content.cloneNode(true));

  const panel = stage.querySelector('.panel');
  if (v.pulse) panel.classList.add('pulse-bowl');

  if (v.ticks) {
    // inserted BEFORE the level so the rising purple covers each one
    const fill = stage.querySelector('.bowl-fill');
    const lvl  = stage.querySelector('.bowl-fill__level');
    for (const p of [25, 50, 75]) {
      const t = document.createElement('span');
      t.className = `tick tick--${p}`;
      t.innerHTML = `<i>${100 - p}%</i>`;
      fill.insertBefore(t, lvl);
    }
  }
  if (v.fb) panel.insertAdjacentHTML('beforeend', v.fb);

  const cap = document.createElement('figcaption');
  cap.className = 'cap';
  cap.innerHTML = `${v.title}<small>${v.note}</small>`;

  cell.append(stage, cap);
  grid.appendChild(cell);
  stages.push(stage);
}

/* ── the cycle: mixing → done (lift + ready) → reset → repeat ────────── */
function runCycle(stage) {
  clearTimers(stage);
  stage.classList.remove('is-mixing', 'is-done', 'is-draining');
  void stage.offsetWidth;                       // restart every animation
  stage.style.setProperty('--fill-ms', fillMs + 'ms');
  stage.classList.add('is-mixing');

  stage._t = [];
  stage._t.push(setTimeout(() => {
    stage.classList.remove('is-mixing');
    stage.classList.add('is-done');             // spoon lifts, ready shows

    if (endMode === 'drain') {
      stage._t.push(setTimeout(() => stage.classList.add('is-draining'), LIFT + 250));
    }
    stage._t.push(setTimeout(() => {
      stage.classList.remove('is-done', 'is-draining');
      stage._t.push(setTimeout(() => runCycle(stage), GAP));
    }, LIFT + READY_HOLD));
  }, DESCEND + fillMs));
}
function clearTimers(stage){ (stage._t || []).forEach(clearTimeout); stage._t = []; }

/* ── the % counters read the DRAWN level, so the number can never
      disagree with what the bowl actually shows ─────────────────────── */
function tick() {
  for (const stage of stages) {
    const num = stage.querySelector('.fb__num');
    if (!num || num.classList.contains('dots')) continue;
    const lvl = stage.querySelector('.bowl-fill__level');
    const box = stage.querySelector('.bowl-fill');
    const pct = Math.round(lvl.getBoundingClientRect().height / box.getBoundingClientRect().height * 100);
    num.textContent = Math.max(0, Math.min(100, pct)) + '%';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ── controls ───────────────────────────────────────────────────────── */
function restartAll(){ stages.forEach(runCycle); }

document.querySelectorAll('[data-end]').forEach(b => b.addEventListener('click', () => {
  endMode = b.dataset.end;
  document.querySelectorAll('[data-end]').forEach(o => o.classList.toggle('on', o === b));
  restartAll();
}));
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
  fillMs = Number(b.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach(o => o.classList.toggle('on', o === b));
  restartAll();
}));
document.getElementById('replay').addEventListener('click', restartAll);

restartAll();
</script>
</body>
</html>
