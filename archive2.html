<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png?v=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOOL — Archive (cards)</title>
<meta name="robots" content="noindex">
<!-- The site's own stylesheets, so each archived entry is the REAL result
     card — byte-for-byte the window that opened on the site — not a redrawn
     spec sheet. live.css is what makes it the single-image variant. -->
<link rel="stylesheet" href="styles.css?v=mid1">
<link rel="stylesheet" href="live.css?v=9">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 100px;
    background: #1a6fff;              /* the logo banner's blue, like archive.html */
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
  }
  header { max-width: 1120px; margin: 0 auto 30px; }
  h1 { margin: 0; font-size: clamp(28px,4vw,50px); font-weight: 700; text-transform: uppercase; }
  .rule { height: 1px; background: #fff; margin: 12px 0 10px; }
  .meta { display: flex; gap: 14px; align-items: baseline; font-size: 13px; flex-wrap: wrap; }
  .count {
    display: inline-flex; align-items: center; height: 25px; padding: 0 11px;
    background: #FFFF00; border: 1px solid #000; border-radius: 12.5px;
    color: #000; font-weight: 700; font-size: 13px;
  }
  .note { color: rgba(255,255,255,.9); }

  /* one card per row, each at its own real size, centred */
  .stack { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
  .row { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  /* the card is authored at 1207×975 and shown at the live size (1055×852);
     it is scaled DOWN to fit a narrow screen but never up. container-type on
     the card means every inner cqw resolves against whatever it ends up. */
  .cardwrap { width: 100%; display: flex; justify-content: center; }
  .mixwin__card {
    /* pin the real size here — the site derives it from --sbw/--s, which do
       not exist on this standalone page */
    width: min(1055px, 92vw) !important;
    height: auto !important;
    aspect-ratio: 1055 / 852;
    margin: 0 !important;
    position: relative;            /* the article/recipe are absolute inside it */
    box-shadow: 0 4px 0 rgba(0,0,0,.28) !important;
  }
  /* the recipe: the two uploads, bottom-left of the card — the small addition
     Noa asked for. Sits over the full-bleed image on its own white chip. */
  .recipe {
    position: absolute; left: 1.331cqw; bottom: 1.331cqw; z-index: 4;
    display: flex; align-items: center; gap: 0.5cqw;
    padding: 0.5cqw 0.66cqw;
    background: rgba(255,255,255,.92);
    border: 1px solid #000; border-radius: 0.66cqw;
  }
  .recipe img {
    width: 3.4cqw; height: 3.4cqw; object-fit: cover;
    border: 1px solid #000; border-radius: 0.33cqw; background: #f0f0f0; display: block;
  }
  .recipe .plus { font-weight: 700; font-size: 1.33cqw; color: #000; }

  /* the DOWNLOAD pill is real and works here; the ✕ is kept for the card's
     look (it does nothing in the archive) */
  .mixwin__dl { cursor: pointer; }
  .mixwin__x { cursor: default; }

  .when { font-size: 12px; color: rgba(255,255,255,.85); }
  .mix.is-loading .mixwin__card { opacity: .5; }

  #empty, #err {
    max-width: 1120px; margin: 0 auto; color: #000;
    padding: 18px 20px; background: #fff; border: 1px dashed #000; border-radius: 11px;
    font-size: 14px;
  }
  #err { border-color: #FE0000; }
  a.switch {
    display: inline-flex; align-items: center; height: 25px; padding: 0 11px;
    background: #FFFF00; border: 1px solid #000; border-radius: 12.5px;
    color: #000; font-weight: 700; font-size: 13px; text-decoration: none;
    text-transform: uppercase; cursor: pointer;
  }
  a.switch:hover { filter: brightness(1.06); }
</style>
</head>
<body>

<header>
  <h1>Archive — cards</h1>
  <div class="rule"></div>
  <div class="meta">
    <span class="count" id="count">—</span>
    <span class="note">Every mix as the card it opened as — full size, with the two uploads, and a real PNG download. Newest first. Private.</span>
    <a class="switch" id="switch">← List view</a>
  </div>
</header>

<p id="empty" hidden>The archive is empty — no mixes have been made yet.</p>
<p id="err" hidden></p>
<div class="stack" id="stack"></div>

<script>
(() => {
  const API = '/.netlify/functions/mix-api';
  const K = new URLSearchParams(location.search).get('k') || undefined;

  const api = async (payload) => {
    const r = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, k: K }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('api ' + r.status));
    return data;
  };

  (function(){ var a=document.getElementById('switch'); if(a) a.href='archive.html'+(K?('?k='+encodeURIComponent(K)):''); })();

  const stack = document.getElementById('stack');
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = (iso) => {
    const d = new Date(iso || 0);
    return isNaN(d) ? '' : d.toLocaleString([], { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  };

  /* the real result card, class-only (no IDs — there are many on the page) */
  function cardHTML(t) {
    return (
    '<div class="mixwin__card" role="figure" aria-label="Generated specimen">' +
      '<div class="mixwin__hero">' +
        '<img class="mixwin__big" alt="Generated specimen">' +
        '<div class="mixwin__article">' +
          '<h2 class="mixwin__title">' + esc(t.name || 'Untitled specimen') + '</h2>' +
          '<div class="mixwin__body">' +
            (t.kind ? '<p class="mixwin__kind"><span class="u">' + esc(t.kind) + '</span></p>' : '') +
            (t.desc ? '<p class="mixwin__desc">' + esc(t.desc) + '</p>' : '') +
          '</div>' +
          '<div class="mixwin__spec mixwin__spec--size">' +
            '<span class="mixwin__spec-label">Size</span>' +
            '<span class="mixwin__spec-rule" aria-hidden="true"></span>' +
            '<span class="mixwin__spec-value">' + esc(t.size || '—') + '</span></div>' +
          '<div class="mixwin__spec mixwin__spec--weight">' +
            '<span class="mixwin__spec-label">Weight</span>' +
            '<span class="mixwin__spec-rule" aria-hidden="true"></span>' +
            '<span class="mixwin__spec-value">' + esc(t.weight || '—') + '</span></div>' +
        '</div>' +
        '<div class="mixwin__actions">' +
          '<button type="button" class="mixwin__dl" aria-label="Download">' +
            '<svg class="mixwin__dl-word" viewBox="0 0 151 30" aria-hidden="true">' +
              '<text x="75.5" y="24" text-anchor="middle" textLength="143" lengthAdjust="spacing" ' +
                'font-family="\'Helvetica Neue\', Helvetica, Arial, sans-serif" font-weight="700" ' +
                'font-size="25" fill="#000" stroke="#000" stroke-width="0.7" stroke-dasharray="2 2" ' +
                'paint-order="stroke">DOWNLOAD</text></svg>' +
          '</button>' +
          '<button type="button" class="mixwin__x" aria-label="Close" tabindex="-1">' +
            '<svg viewBox="0 0 26 26" aria-hidden="true">' +
              '<path d="M22.5601 6.01379L19.9862 3.43992L3.43992 19.9862L6.01378 22.5601L22.5601 6.01379Z" fill="currentColor"/>' +
              '<path d="M6.01379 3.43992L3.43992 6.01378L19.9862 22.5601L22.5601 19.9862L6.01379 3.43992Z" fill="currentColor"/>' +
            '</svg></button>' +
        '</div>' +
        '<div class="recipe" aria-label="The two uploads">' +
          '<img class="in-a" alt="Upload 1"><span class="plus">+</span><img class="in-b" alt="Upload 2">' +
        '</div>' +
      '</div>' +
    '</div>');
  }

  function row(item, n) {
    const el = document.createElement('div');
    el.className = 'mix row is-loading';
    el.innerHTML =
      '<div class="cardwrap">' + cardHTML(item.text || {}) + '</div>' +
      '<div class="when">' + esc(String(n).padStart(2,'0')) + ' · ' + esc(when(item.at)) + '</div>';
    return el;
  }

  /* ── PNG = a snapshot of the REAL rendered card ─────────────────────────
     Everything is read back off the card as it actually sits on screen — the
     card's own box, each text line's measured position and wrap, the rules,
     the uploads chip, the DOWNLOAD pill and the X — and drawn onto the canvas
     at those exact coordinates. Nothing is re-derived from Figma numbers, so
     the download cannot drift from the display: it IS the display, at 2×.
     (An SVG/foreignObject snapshot was the obvious route, but the card is
     built entirely on container-query units, which do not resolve when an SVG
     is rasterised as an image — the text vanishes. Measuring the live DOM
     sidesteps that completely.) */
  const OUT_W = 2110;                    // 1055 × 2

  const roundRect = (g, x, y, w, h, r) => {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r); g.closePath();
  };

  /* draw a card's own inline <svg> (the DOWNLOAD word, the ✕) onto the canvas
     at its measured rect, by rasterising that exact element — so the vector is
     what the card shows, not a redraw. Self-contained (system font, paths). */
  async function drawSVGel(g, svgEl, rect, color) {
    if (!svgEl || !rect || !rect.w) return;
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', Math.round(rect.w));
    clone.setAttribute('height', Math.round(rect.h));
    if (color) clone.style.color = color;           // resolves fill="currentColor"
    const str = new XMLSerializer().serializeToString(clone);
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
    try {
      const im = await new Promise((res, rej) => {
        const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('svg'));
        i.src = url;
      });
      g.drawImage(im, rect.x, rect.y, rect.w, rect.h);
    } catch (e) {}
  }

  async function snapshot(cardEl) {
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    const cr = cardEl.getBoundingClientRect();
    const s = OUT_W / cr.width;                       // rendered px → canvas px
    const c = document.createElement('canvas');
    c.width = Math.round(cr.width * s); c.height = Math.round(cr.height * s);
    const g = c.getContext('2d');

    /* rect of any descendant, in canvas coordinates */
    const R = (el) => { const r = el.getBoundingClientRect();
      return { x: (r.left - cr.left) * s, y: (r.top - cr.top) * s, w: r.width * s, h: r.height * s }; };

    /* the lines of a text element, exactly as it wrapped on screen: group its
       words by the top of each word's own client rect */
    const linesOf = (el) => {
      const node = [...el.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim())
                 || el.firstChild;
      if (!node || node.nodeType !== 3) {
        const t = el.textContent.trim();
        if (!t) return [];
        const r = R(el); return [{ text: t, x: r.x, y: r.y }];
      }
      const txt = node.textContent;
      const rng = document.createRange();
      const out = []; let i = 0;
      while (i < txt.length) {
        while (i < txt.length && txt[i] === ' ') i++;
        let j = i; while (j < txt.length && txt[j] !== ' ') j++;
        if (j <= i) break;
        rng.setStart(node, i); rng.setEnd(node, j);
        const rc = rng.getBoundingClientRect();
        const word = txt.slice(i, j);
        const top = Math.round(rc.top - cr.top);
        const last = out[out.length - 1];
        if (last && Math.abs(last.top - top) < 2) { last.text += ' ' + word; }
        else { out.push({ text: word, top: top, x: (rc.left - cr.left) * s, y: (rc.top - cr.top) * s }); }
        i = j;
      }
      return out;
    };

    const drawText = (el) => {
      if (!el) return;
      const st = getComputedStyle(el);
      g.fillStyle = st.color;
      g.font = st.fontStyle + ' ' + st.fontWeight + ' ' +
               (parseFloat(st.fontSize) * s) + 'px ' + st.fontFamily;
      g.textBaseline = 'top';
      for (const ln of linesOf(el)) g.fillText(ln.text, ln.x, ln.y);
    };

    /* white ground, clipped to the card's rounded rect */
    const radius = 0.009 * cr.width * s;               // border-radius 0.9cqw
    g.save();
    roundRect(g, 0.5 * s, 0.5 * s, c.width - s, c.height - s, radius);
    g.clip();
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);

    /* the specimen photo — object-fit cover over the whole card, as live.css */
    const big = cardEl.querySelector('.mixwin__big');
    if (big && big.complete && big.naturalWidth) {
      const k = Math.max(c.width / big.naturalWidth, c.height / big.naturalHeight);
      const w = big.naturalWidth * k, h = big.naturalHeight * k;
      g.drawImage(big, (c.width - w) / 2, (c.height - h) / 2, w, h);
    }

    /* the article text, each block at its measured place */
    drawText(cardEl.querySelector('.mixwin__title'));
    const kind = cardEl.querySelector('.mixwin__kind');
    if (kind) {
      drawText(kind);
      const u = kind.querySelector('.u') || kind;      // its underline
      const ur = R(u), fs = parseFloat(getComputedStyle(kind).fontSize) * s;
      g.fillStyle = getComputedStyle(kind).color;
      g.fillRect(ur.x, ur.y + fs * 1.02, ur.w, Math.max(1, s));
    }
    drawText(cardEl.querySelector('.mixwin__desc'));
    for (const spec of cardEl.querySelectorAll('.mixwin__spec')) {
      drawText(spec.querySelector('.mixwin__spec-label'));
      drawText(spec.querySelector('.mixwin__spec-value'));
      const rl = spec.querySelector('.mixwin__spec-rule');
      if (rl) { const r = R(rl); g.fillStyle = '#000'; g.fillRect(r.x, r.y, r.w, Math.max(1, s)); }
    }

    /* the uploads chip — its own box, the two thumbs (cover), the plus */
    const recipe = cardEl.querySelector('.recipe');
    if (recipe) {
      const rr = R(recipe), rs = getComputedStyle(recipe);
      roundRect(g, rr.x, rr.y, rr.w, rr.h, parseFloat(rs.borderTopLeftRadius) * s);
      g.fillStyle = rs.backgroundColor; g.fill();
      g.lineWidth = Math.max(1, s); g.strokeStyle = '#000'; g.stroke();
      for (const im of recipe.querySelectorAll('img')) {
        const ir = R(im), irad = parseFloat(getComputedStyle(im).borderTopLeftRadius) * s;
        g.save(); roundRect(g, ir.x, ir.y, ir.w, ir.h, irad); g.clip();
        g.fillStyle = '#f0f0f0'; g.fillRect(ir.x, ir.y, ir.w, ir.h);
        if (im.complete && im.naturalWidth) {
          const k = Math.max(ir.w / im.naturalWidth, ir.h / im.naturalHeight);
          const w = im.naturalWidth * k, h = im.naturalHeight * k;
          g.drawImage(im, ir.x + (ir.w - w) / 2, ir.y + (ir.h - h) / 2, w, h);
        }
        g.restore();
        g.save(); roundRect(g, ir.x, ir.y, ir.w, ir.h, irad); g.lineWidth = Math.max(1, s);
        g.strokeStyle = '#000'; g.stroke(); g.restore();
      }
      drawText(recipe.querySelector('.plus'));
    }

    /* DOWNLOAD pill (yellow) — the word is the card's OWN inline SVG, drawn as
       an image so the dashed contour and the textLength stretch are exactly
       what the card shows, not a re-typed approximation. */
    const dl = cardEl.querySelector('.mixwin__dl');
    if (dl) {
      const dr = R(dl), ds = getComputedStyle(dl);
      roundRect(g, dr.x, dr.y, dr.w, dr.h, parseFloat(ds.borderTopLeftRadius) * s);
      g.fillStyle = ds.backgroundColor; g.fill();
      g.lineWidth = Math.max(1, s); g.strokeStyle = '#000'; g.stroke();
      await drawSVGel(g, dl.querySelector('svg'), R(dl.querySelector('svg')));
    }

    /* the X — red circle from the button's own style, then its OWN inline ✕
       SVG drawn as an image */
    const xb = cardEl.querySelector('.mixwin__x');
    if (xb) {
      const xr = R(xb), xs = getComputedStyle(xb);
      const cx = xr.x + xr.w / 2, cy = xr.y + xr.h / 2, rr2 = Math.min(xr.w, xr.h) / 2;
      g.beginPath(); g.arc(cx, cy, rr2 - s / 2, 0, Math.PI * 2);
      g.fillStyle = xs.backgroundColor; g.fill();
      g.lineWidth = Math.max(1, s); g.strokeStyle = '#000'; g.stroke();
      const xsvg = xb.querySelector('svg');
      if (xsvg) { g.fillStyle = xs.color;   // the ✕ is currentColor (black)
        await drawSVGel(g, xsvg, R(xsvg), xs.color); }
    }

    g.restore();   // release the card clip

    /* the card's own dashed edge, on top */
    const bs = getComputedStyle(cardEl);
    g.setLineDash([2 * s, 2 * s]); g.lineWidth = Math.max(1, s); g.strokeStyle = '#000';
    roundRect(g, 0.5 * s, 0.5 * s, c.width - s, c.height - s, radius);
    g.stroke(); g.setLineDash([]);

    return await new Promise((res) => c.toBlob(res, 'image/png'));
  }

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      io.unobserve(e.target);
      const el = e.target;
      api({ action: 'archive-get', id: el.dataset.id }).then((rec) => {
        const t = rec.text || {};
        const res = rec.result || rec.result_url;
        el.querySelector('.mixwin__big').src = res;
        el.querySelector('.in-a').src = rec.a || '';
        el.querySelector('.in-b').src = rec.b || '';
        el.classList.remove('is-loading');
        const dl = el.querySelector('.mixwin__dl');
        const cardEl = el.querySelector('.mixwin__card');
        dl.addEventListener('click', async () => {
          const prev = dl.style.opacity; dl.style.opacity = '.5';
          try {
            const blob = await snapshot(cardEl);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'toool-' + el.dataset.id + '.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 8000);
          } catch (err) { console.error(err); }
          dl.style.opacity = prev;
        });
      }).catch(() => el.classList.remove('is-loading'));
    }
  }, { rootMargin: '700px' });

  api({ action: 'archive-list' }).then(({ items }) => {
    document.getElementById('count').textContent =
      items.length + (items.length === 1 ? ' specimen' : ' specimens');
    if (!items.length) { document.getElementById('empty').hidden = false; return; }
    items.forEach((item, i) => {
      const el = row(item, items.length - i);
      el.dataset.id = item.id;
      stack.appendChild(el);
      io.observe(el);
    });
  }).catch((e) => {
    const err = document.getElementById('err');
    err.textContent = /key/i.test(e.message)
      ? 'This archive is private — open it with your key link (archive2.html?k=…).'
      : 'Could not load the archive: ' + e.message;
    err.hidden = false;
    document.getElementById('count').textContent = '—';
  });
})();
</script>
</body>
</html>
